<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#741521"><title>KC Communication 1.0</title><link rel="stylesheet" href="./kc-v1.css?v=1"><link rel="stylesheet" href="./kc-v1-fileseries.css?v=8"><style>.donut{--p:0;width:92px;height:92px;margin:7px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),#ece5de 0);position:relative}.donut:before{content:'';position:absolute;inset:12px;border-radius:50%;background:#fff}.donut b{z-index:1}.center{text-align:center}.metricbars label{display:grid;grid-template-columns:45px 1fr 38px;gap:6px;align-items:center;margin:10px 0;font-size:10px}.metricbars label span{height:10px;background:var(--b);border-radius:8px;min-width:4px}.dot.warn{background:var(--warn)}</style></head><body><div id="login" class="login"><section class="loginbox"><div class="brand">👨‍🍳 Köcheclub Werne</div><h1 style="text-align:center">KC Communication</h1><p class="muted" style="text-align:center">Zentrale Kommunikationsdrehscheibe · Version <b>1.0.0</b></p><div id="loginError"></div><form id="loginForm"><div class="field"><label>E-Mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Passwort</label><input id="password" type="password" autocomplete="current-password" required></div><label><input id="remember" type="checkbox" checked> angemeldet bleiben</label><p><button class="btn primary" style="width:100%">Anmelden</button></p></form></section></div><div id="app" class="app hidden"><header class="top"><div><small class="muted">Köcheclub Werne</small><h1>KC Communication</h1><small>Version <b>1.0.0</b> · Professional Core</small></div><div class="tools"><button id="refreshBtn" class="btn">↻ Aktualisieren</button><button id="updateBtn" class="btn">Updates prüfen</button><div class="dbs" title="Oben Status · unten Traffic"><div class="db
