name: Deploy KC Communication Public to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build enhanced public site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          mv _site/index.html _site/legacy.html
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#741521">
            <title>KC Communication 0.4.0</title>
            <style>html,body,#kcframe{width:100%;height:100%;margin:0;border:0;display:block;background:#f6f2ec}</style>
          </head>
          <body>
            <iframe id="kcframe" src="./legacy.html?v=0.4.0" title="KC Communication"></iframe>
            <script>
              const f=document.getElementById('kcframe');
              f.addEventListener('load',()=>{
                try{
                  const d=f.contentDocument;
                  if(!d) return;
                  d.querySelectorAll('.appVersion').forEach(x=>x.textContent='0.4.0');
                  const s=d.createElement('script');
                  s.id='kcx-enhancer';
                  s.src='./console.js?v=0.4.0';
                  d.body.appendChild(s);
                  setTimeout(()=>d.querySelectorAll('.appVersion').forEach(x=>x.textContent='0.4.0'),300);
                }catch(e){console.error('KC enhancer could not be loaded',e);}
              });
            </script>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
