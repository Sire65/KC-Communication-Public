name: Deploy KC Communication Public to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site without wrappers
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          test -f _site/index.html
          test -f _site/v1/index.html
          test -f _site/v1/kc-v1-update.js
          test -f _site/releases/latest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
