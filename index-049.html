<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#741521"><title>KC Communication 0.4.9</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1ec}#appframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="appframe" src="./index-048.html?v=0.4.9" title="KC Communication"></iframe><script>(()=>{'use strict';const f=document.getElementById('appframe');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)return;try{d.title='KC Communication 0.4.9';d.querySelectorAll('b').forEach(b=>{if((b.textContent||'').trim()==='0.4.8')b.textContent='0.4.9'});const st=d.createElement('style');st.textContent=`.traffic{visibility:visible!important;opacity:1!important;background:#b7b7b7!important;box-shadow:none!important;transition:none!important}.traffic.flash,.traffic.stream-on{visibility:visible!important;background:#e8a500!important;opacity:1!important;box-shadow:0 0 7px #e8a500!important}.diag-rating{display:block;margin-top:5px;font-size:12px;font-weight:800}.diag-rating.veryfast{color:#168348}.diag-rating.fast{color:#24834f}.diag-rating.normal{color:#8a6a00}.diag-rating.slow{color:#c06d00}.diag-rating.veryslow{color:#bd2f2f}`;d.head.appendChild(st);const title=d.getElementById('speedTitle'),v1=d.getElementById('gauge1Value'),v2=d.getElementById('gauge2Value'),info=d.getElementById('speedInfo');function classify(ms,kind){const n=Number(ms);const local=kind.includes('IndexedDB');const cuts=local?[50,150,400,800]:[200,400,800,1500];if(n<=cuts[0])return['Sehr schnell','veryfast'];if(n<=cuts[1])return['Schnell','fast'];if(n<=cuts[2])return['Normal','normal'];if(n<=cuts[3])return['Langsam','slow'];return['Sehr langsam','veryslow']}function attach(el){if(!el)return null;const box=el.closest('.gauge');if(!box)return null;let r=box.parentElement?.querySelector('.diag-rating');if(!r){r=d.createElement('span');r.className='diag-rating';(box.parentElement||box).appendChild(r)}return r}const r1=attach(v1),r2=attach(v2);function update(){const kind=title?.textContent||'';[[v1,r1],[v2,r2]].forEach(([v,r])=>{if(!v||!r)return;const m=(v.textContent||'').match(/([0-9]+(?:[.,][0-9]+)?)\s*ms/i);if(!m){r.textContent='';return}const ms=parseFloat(m[1].replace(',','.')),c=classify(ms,kind);r.textContent=c[0];r.className='diag-rating '+c[1]});if(info&&/Test fehlgeschlagen/i.test(info.textContent||'')){[r1,r2].forEach(r=>{if(r){r.textContent='Fehler';r.className='diag-rating veryslow'}})}}const mo=new MutationObserver(update);[v1,v2,info,title].filter(Boolean).forEach(e=>mo.observe(e,{childList:true,subtree:true,characterData:true}));update();const trafficEls=[...d.querySelectorAll('.traffic')],timers=new WeakMap(),flashState=new WeakMap();function startStream(el){const old=timers.get(el);if(old){if(old.stop)clearTimeout(old.stop);if(old.next)clearTimeout(old.next)}let running=true;const pulse=()=>{if(!running)return;el.classList.toggle('stream-on',Math.random()>.34);const next=setTimeout(pulse,45+Math.floor(Math.random()*115));const cur=timers.get(el)||{};cur.next=next;timers.set(el,cur)};pulse();const stop=setTimeout(()=>{running=false;const cur=timers.get(el);if(cur?.next)clearTimeout(cur.next);el.classList.remove('stream-on');timers.delete(el)},1250+Math.floor(Math.random()*450));timers.set(el,{...(timers.get(el)||{}),stop})}trafficEls.forEach(el=>{flashState.set(el,el.classList.contains('flash'));const obs=new MutationObserver(()=>{const isFlash=el.classList.contains('flash'),wasFlash=flashState.get(el)===true;if(isFlash&&!wasFlash)startStream(el);flashState.set(el,isFlash)});obs.observe(el,{attributes:true,attributeFilter:['class']})});const ub=d.getElementById('updateBtn'),ud=d.getElementById('updateDialog');if(ub){ub.onclick=()=>{try{if(ud?.open)ud.close()}catch{}const n=d.getElementById('notice');if(n){n.textContent='KC Communication 0.4.9 ist auf dem aktuellen Stand.';n.className='notice success'}}}const ib=d.getElementById('installBtn');if(ib){ib.onclick=()=>{try{if(ud?.open)ud.close()}catch{}const n=d.getElementById('notice');if(n){n.textContent='KC Communication 0.4.9 ist bereits installiert.';n.className='notice success'}}}}catch(e){console.error('KC 0.4.9 patch:',e)}});})();</script></body></html>
