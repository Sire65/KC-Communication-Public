<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC Communication</title><style>:root{--b:#741521;--bg:#f5f2ed;--line:#ddd4ca;--ok:#24834f;--warn:#d69715;--bad:#bd2f2f;--blue:#3478c7;--muted:#6d6966}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:#292625}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.login-card{width:min(600px,94vw);padding:28px}.brand{text-align:center;color:var(--b);font:700 32px Georgia}.muted{color:var(--muted)}.field{display:grid;gap:5px;margin:12px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:9px}.btn,.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary,.tab.active{background:var(--b);color:#fff}.full{width:100%}.app{max-width:1500px;margin:auto;padding:12px}.top,.tools,.tabs,.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.top h1{color:var(--b);margin:2px 0}.notice{margin:8px 0;padding:9px;border-radius:9px;background:#edf4fb}.notice.success{background:#eaf6ee;color:#246d45}.notice.error{background:#fff0ef;color:#922e2e}.dbs{display:flex;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.db{width:70px;padding:5px 7px;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 10px;grid-template-rows:15px 10px;gap:2px 5px;align-items:center;font-size:10px;font-weight:800}.db:last-child{border:0}.led,.traffic{width:9px;height:9px;border-radius:50%;display:inline-block;background:#999}.led.ok{background:var(--ok);box-shadow:0 0 5px var(--ok)}.led.warn{background:var(--warn)}.led.bad{background:var(--bad)}.traffic{background:#e8a500;opacity:.18;grid-column:2;grid-row:2}.traffic.flash{opacity:1;box-shadow:0 0 7px #e8a500}.traffic-word{font-size:8px;color:var(--muted);grid-column:1;grid-row:2}.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px}.kpi small{color:var(--muted);font-size:10px}.kpi b{display:block;font-size:19px}.dash{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.chart{min-height:190px}.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:100px 1fr 38px;gap:6px;align-items:center;font-size:11px}.track{height:10px;background:#eee;border-radius:9px;overflow:hidden}.fill{height:100%;background:#667085}.donut{width:145px;height:145px;border-radius:50%;margin:8px auto;position:relative}.donut:after{content:'';position:absolute;inset:32px;border-radius:50%;background:#fff}.legend{font-size:11px;display:grid;gap:5px}.program,.provider,.test{border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:7px}.badge{padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#eee}.badge.ok{background:#e7f4eb;color:#237447}.badge.warn{background:#fff2dc;color:#9a6309}.badge.bad{background:#ffe9e7;color:#9b2b2b}.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.result{margin-top:6px;font-size:12px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}@media(max-width:1000px){.kpis{grid-template-columns:repeat(4,1fr)}.dash{grid-template-columns:1fr 1fr}.tests{grid-template-columns:1fr 1fr}}@media(max-width:650px){.kpis,.dash,.tests{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="login"><section class="login-card"><div class="brand">👨‍🍳 Köcheclub Werne</div><h1 style="text-align:center">KC Communication</h1><p class="muted" style="text-align:center">Zentrale Kommunikationssteuerung · Version <b>0.4.3</b></p><div id="loginError"></div><form id="loginForm"><div class="field"><label>E-Mail</label><input id="email" type="email" required></div><div class="field"><label>Passwort</label><input id="password" type="password" required></div><p><button class="btn primary full">Anmelden</button></p></form></section></div><div id="app" class="app hidden"><header class="top"><div><small class="muted">Köcheclub Werne</small><h1>KC Communication</h1><small>Version <b>0.4.3</b></small></div><div class="tools"><button id="updateBtn" class="btn">Updates prüfen</button><div class="dbs"><div class="db"><span>IDX</span><i id="idxLed" class="led warn"></i><span class="traffic-word">Traffic</span><i id="idxTraffic" class="traffic"></i></div><div class="db"><span>SUP</span><i id="supLed" class="led warn"></i><span class="traffic-word">Traffic</span><i id="supTraffic" class="traffic"></i></div><div class="db"><span>PUSH</span><i id="pushLed" class="led warn"></i><span class="traffic-word">Traffic</span><i id="pushTraffic" class="traffic"></i></div></div><button id="logoutBtn" class="btn">🚪 Abmelden</button></div></header><div id="notice" class="notice">Start …</div><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="devices">Push-Geräte</button><button class="tab" data-tab="programs">Programme</button><button class="tab" data-tab="tests">Testcenter</button><button class="tab" data-tab="settings">Einstellungen</button></nav><main id="content"></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const VERSION='0.4.3',SUPA='https://ptblnpiroqftcvlsrhac.supabase.co',KEY='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24',$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sb=window.supabase.createClient(SUPA,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let overview={},devices={devices:[]},health={providers:[]};const notice=(t,c='')=>{$('notice').textContent=t;$('notice').className='notice '+c};const flash=k=>{const e=$(k+'Traffic');if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),180)}};async function invoke(n,b={}){flash(n.includes('push')?'push':'sup');const t=performance.now(),{data,error}=await sb.functions.invoke(n,{body:b});if(error)throw error;return{data,ms:performance.now()-t}}async function idb(){const t=performance.now(),db=await new Promise((ok,bad)=>{const r=indexedDB.open('kc-communication-public',5);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('health'))r.result.createObjectStore('health')};r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)});await new Promise((ok,bad)=>{const tx=db.transaction('health','readwrite'),s=tx.objectStore('health');s.put(Date.now(),'probe');s.get('probe');tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)});db.close();flash('idx');return performance.now()-t}async function load(){const [o,d,h]=await Promise.all([invoke('kc-communication-console',{action:'overview'}),invoke('kc-communication-push-devices',{action:'list'}).catch(()=>({data:{devices:[]}})),invoke('kc-communication-provider-health',{}).catch(()=>({data:{providers:[]}}))]);overview=o.data||{};devices=d.data||{devices:[]};health=h.data||{providers:[]};$('supLed').className='led ok';const ph=(health.providers||[]).find(x=>x.channel==='push');$('pushLed').className='led '+(ph?.outboundReady?'ok':'warn');try{await idb();$('idxLed').className='led ok'}catch{$('idxLed').className='led bad'}}function state(r){const s=String(r.status||'').toLowerCase();return['sent','delivered','success','processed','ok','accepted'].includes(s)?'ok':['failed','error','rejected','dead_lettered'].includes(s)?'bad':'warn'}function dashboard(){const all=overview.requests||[],r=all.filter(x=>new Date(x.created_at||x.sent_at||0)>Date.now()-86400000),ok=r.filter(x=>state(x)==='ok').length,bad=r.filter(x=>state(x)==='bad').length,warn=r.length-ok-bad,channels={},programs={};r.forEach(x=>{const c=x.channel||'Sonstige',p=x.source_program||'System';channels[c]=(channels[c]||0)+1;programs[p]=(programs[p]||0)+1});const max=Math.max(1,...Object.values(programs));const ch=Object.entries(channels),total=Math.max(1,r.length);let acc=0,cols=['#3478c7','#24834f','#d69715','#8a55c5','#bd2f2f'];const stops=ch.map(([k,v],i)=>{const a=acc/total*360;acc+=v;return cols[i%cols.length]+' '+a+'deg '+acc/total*360+'deg'}).join(',');$('content').innerHTML='<div class="kpis"><div class="kpi"><small>Vorgänge 24h</small><b>'+r.length+'</b></div><div class="kpi"><small>OK</small><b>'+ok+'</b></div><div class="kpi"><small>Retry/Warn</small><b>'+warn+'</b></div><div class="kpi"><small>Fehler</small><b>'+bad+'</b></div><div class="kpi"><small>Erfolgsquote</small><b>'+(r.length?Math.round(ok/r.length*1000)/10+'%':'–')+'</b></div><div class="kpi"><small>Programme</small><b>'+(overview.programs||[]).length+'</b></div><div class="kpi"><small>Push-Geräte</small><b>'+(devices.devices||[]).filter(x=>x.active).length+'</b></div><div class="kpi"><small>Version</small><b>'+VERSION+'</b></div></div><div class="dash"><section class="card chart"><h3>Versand nach Kanal · 24h</h3><div class="donut" style="background:conic-gradient('+(stops||'#ddd 0 360deg')+')"></div><div class="legend">'+(ch.map(([k,v],i)=>'<span>● '+esc(k)+': <b>'+v+'</b></span>').join('')||'Noch keine Vorgänge')+'</div></section><section class="card chart"><h3>Versand nach Programm · 24h</h3><div class="bars">'+(Object.entries(programs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="bar"><span>'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+Math.round(v/max*100)+'%"></div></div><b>'+v+'</b></div>').join('')||'Noch keine Vorgänge')+'</div></section><section class="card chart"><h3>Status · 24h</h3><div class="bars"><div class="bar"><span>OK</span><div class="track"><div class="fill" style="width:'+(r.length?ok/r.length*100:0)+'%"></div></div><b>'+ok+'</b></div><div class="bar"><span>Retry/Warn</span><div class="track"><div class="fill" style="width:'+(r.length?warn/r.length*100:0)+'%"></div></div><b>'+warn+'</b></div><div class="bar"><span>Fehler</span><div class="track"><div class="fill" style="width:'+(r.length?bad/r.length*100:0)+'%"></div></div><b>'+bad+'</b></div></div></section><section class="card"><h3>Programme</h3>'+((overview.programs||[]).map(p=>'<div class="program"><i class="led '+(p.status==='active'?'ok':'warn')+'"></i> <b>'+esc(p.display_name||p.id)+'</b></div>').join('')||'Keine Programme')+'</section><section class="card" style="grid-column:span 2"><h3>Letzte Kommunikation</h3>'+all.slice(0,8).map(x=>'<div class="program"><i class="led '+state(x)+'"></i> <b>'+esc(x.source_program||'System')+'</b> · '+esc(x.channel||'')+' · '+esc(x.status||'')+'</div>').join('')+'</section></div>'}function settings(){const rs=overview.routes||[],ps=overview.providers||[],hp=health.providers||[];$('content').innerHTML='<section class="card"><h2>Provider & Versandwege</h2>'+rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),n=String(p?.display_name||r.provider_id||''),h=hp.find(x=>String(x.provider||'').toLowerCase()===n.toLowerCase().replace(/.*brevo.*/,'brevo').replace(/.*resend.*/,'resend').replace(/.*web push.*/,'web-push'));let cls='warn',txt='inaktiv';if(!r.enabled){txt='Route gesperrt'}else if(h?.productionReady||h?.outboundReady&&r.channel==='push'){cls='ok';txt='aktiv'}else if(n.toLowerCase().includes('resend')){txt='nicht produktionsbereit'}else{txt='nicht bereit'}return'<div class="provider"><span class="statusline"><i class="led '+cls+'"></i><b>'+esc((r.channel||'').toUpperCase())+' · '+esc(n)+'</b><span class="badge '+cls+'">'+txt+'</span></span><div class="muted">Route: '+(r.enabled?'freigegeben':'gesperrt')+' · Failover: '+(r.auto_failover?'ja':'nein')+' · Kostenregel: '+esc(r.cost_policy||'–')+'</div></div>'}).join('')+'</section>'}async function testOne(id){const box=$('res'+id);box.textContent='läuft …';try{let t='';if(id===1){const a=await idb(),b=await invoke('kc-communication-console',{action:'health'});t='IDX '+Math.round(a)+' ms · Supabase '+Math.round(b.ms)+' ms'}else if(id===2){if(!(await sb.auth.getSession()).data.session)throw Error('keine Sitzung');t='Sitzung/Token gültig'}else if(id===3){const h=await invoke('kc-communication-provider-health',{});t='Provider-Health OK · '+(h.data.providers||[]).filter(x=>x.outboundReady).length+' bereit'}else if(id===4)t='Status-/Fehlerauswertung OK';else if(id===5)t=(overview.routes||[]).filter(x=>x.auto_failover).length+' Failover-Routen geprüft';else if(id===6)t=(overview.routes||[]).length+' Routen geprüft';else if(id===7)t=(overview.programs||[]).length+' Programme/Rechte geladen';else if(id===8)t=(overview.requests||[]).length+' Queue-/Retry-Datensätze lesbar';else if(id===9){if(location.protocol!=='https:')throw Error('HTTPS fehlt');t='HTTPS und Client-Konfiguration OK'}else{await idb();await invoke('kc-communication-console',{action:'overview'});t='lokale + zentrale DB OK'}box.className='result ok';box.textContent='✓ '+t;return true}catch(e){box.className='result bad';box.textContent='✗ '+(e.message||e);return false}}function tests(){$('content').innerHTML='<section class="card"><h2>Testcenter</h2><button id="allTests" class="btn primary">Alle 10 Tests</button><div class="tests">'+['Verbindungen','Authentifizierung','Provider-Health','Status/Rückmeldung','Failover','Routen/Kanäle','Programme/Rechte','Queue/Retry','Sicherheit','Datenbanken'].map((x,i)=>'<div class="test"><b>'+(i+1)+'. '+x+'</b><p><button class="btn" data-test="'+(i+1)+'">Start</button></p><div id="res'+(i+1)+'" class="result">noch nicht getestet</div></div>').join('')+'</div></section>';document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>testOne(+b.dataset.test));$('allTests').onclick=async()=>{let n=0;for(let i=1;i<=10;i++)if(await testOne(i))n++;notice('Testlauf abgeschlossen: '+n+'/10 erfolgreich.',n===10?'success':'error')}}function programs(){$('content').innerHTML='<section class="card"><h2>Programme</h2>'+((overview.programs||[]).map(p=>'<div class="program"><i class="led '+(p.status==='active'?'ok':'warn')+'"></i> <b>'+esc(p.display_name||p.id)+'</b> · '+esc((p.allowed_channels||[]).join(', '))+'</div>').join('')||'Keine Programme')+'</section>'}function devicesView(){$('content').innerHTML='<section class="card"><h2>Push-Geräte</h2>'+((devices.devices||[]).map(d=>'<div class="program"><i class="led '+(d.active?'ok':'warn')+'"></i> <b>'+esc(d.device_name||d.id||'Gerät')+'</b></div>').join('')||'Keine Geräte')+'</section>'}function render(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({dashboard,settings,tests,programs,devices:devicesView}[t]||dashboard)()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('updateBtn').onclick=()=>notice('KC Communication '+VERSION+' ist aktuell.','success');$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginError').textContent=error.message};sb.auth.onAuthStateChange(async(_,s)=>{if(!s)return;document.querySelector('#login').classList.add('hidden');$('app').classList.remove('hidden');try{await load();render('dashboard');notice('KC Communication '+VERSION+' bereit.','success')}catch(e){notice('Startfehler: '+(e.message||e),'error')}});sb.auth.getSession().then(({data})=>{if(data.session)sb.auth.onAuthStateChange(()=>{})});})();</script></body></html>
