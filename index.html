<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#741521"><title>KC Communication</title><style>:root{--b:#741521;--b2:#951f32;--bg:#f4f1ec;--card:#fff;--ink:#262322;--muted:#6d6966;--line:#ded6cd;--ok:#24834f;--warn:#d69715;--bad:#bd2f2f;--blue:#3478c7;--shadow:0 3px 12px rgba(40,28,20,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(600px,94vw);background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 32px;box-shadow:0 14px 40px #4c37231c}.brand{text-align:center;color:var(--b);font:700 30px Georgia,serif}.muted{color:var(--muted)}.field{display:grid;gap:5px;margin:11px 0}.field input{padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px}.btn,.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.btn.primary,.tab.active{background:var(--b);border-color:var(--b);color:#fff}.btn.danger{color:var(--bad)}.full{width:100%}.app{max-width:1480px;margin:auto;padding:10px 12px}.top,.tools,.tabs,.statusline,.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.top h1{margin:0;color:var(--b);font-size:25px}.eyebrow{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800}.notice{margin:7px 0;padding:7px 10px;border-radius:8px;background:#edf4fb;font-size:12px}.notice.success{background:#eaf6ee;color:#246d45}.notice.error{background:#fff0ef;color:#922e2e}.tabs{margin-bottom:8px}.tab{padding:7px 10px;font-size:12px}.dbs{display:flex;border:1px solid var(--line);background:#fff;border-radius:9px;overflow:hidden}.db{width:50px;padding:4px 6px;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 9px;grid-template-rows:13px 8px;gap:1px 4px;align-items:center;font-size:9px;font-weight:800;cursor:pointer}.db:last-child{border-right:0}.led,.traffic,.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#aaa;flex:0 0 auto}.led.ok,.dot.ok{background:var(--ok);box-shadow:0 0 5px var(--ok)}.led.warn,.dot.warn{background:var(--warn)}.led.bad,.dot.bad{background:var(--bad)}.led.blue,.dot.blue{background:var(--blue)}.traffic{grid-column:2;grid-row:2;background:#e8a500;opacity:.15}.traffic.flash{opacity:1;box-shadow:0 0 6px #e8a500}.card{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.dash-head{display:grid;grid-template-columns:1.5fr 1fr;gap:7px}.program-strip{padding:7px 9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:38px}.program-chip{display:inline-flex;gap:4px;align-items:center;font-size:10px;white-space:nowrap}.provider-mini{padding:7px 9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:38px}.provider-chip{display:inline-flex;gap:4px;align-items:center;font-size:10px}.kpis{display:grid;grid-template-columns:repeat(8,minmax(72px,1fr));gap:5px;margin-top:6px}.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 7px;min-height:49px}.kpi small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:700;line-height:1.1}.kpi b{display:block;font-size:18px;margin-top:2px}.kpi .trend{font-size:9px;color:var(--muted)}.dash-grid{display:grid;grid-template-columns:1.15fr 1.15fr .8fr;grid-template-rows:auto auto;gap:6px;margin-top:6px}.panel{padding:8px 9px;min-height:158px}.panel h3{margin:0 0 6px;font-size:12px;color:#4a3330}.panel-sub{font-size:9px;color:var(--muted);margin-top:-3px;margin-bottom:6px}.donut-row{display:flex;align-items:center;gap:12px}.donut{width:112px;height:112px;border-radius:50%;position:relative;flex:0 0 auto}.donut:after{content:'';position:absolute;inset:25px;border-radius:50%;background:#fff}.legend{font-size:10px;display:grid;gap:4px;line-height:1.2}.bars{display:grid;gap:5px}.bar{display:grid;grid-template-columns:92px 1fr 28px;gap:5px;align-items:center;font-size:10px}.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:8px;background:#eee;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#826f74,var(--b))}.status-bars .fill.ok{background:var(--ok)}.status-bars .fill.warn{background:var(--warn)}.status-bars .fill.bad{background:var(--bad)}.recent-list{display:grid;gap:3px;max-height:143px;overflow:hidden}.recent{display:grid;grid-template-columns:8px 1fr auto;gap:5px;align-items:center;padding:4px 0;border-bottom:1px solid #eee;font-size:10px}.recent:last-child{border-bottom:0}.recent-main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recent-time{font-size:9px;color:var(--muted);white-space:nowrap}.wide{grid-column:span 2}.provider-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.provider-box{border:1px solid #eee;border-radius:8px;padding:6px;font-size:10px}.provider-box b{display:block;margin-bottom:2px}.section{padding:11px}.program,.provider,.device,.test{border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px}.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:800;background:#eee}.badge.ok{background:#e7f4eb;color:#237447}.badge.warn{background:#fff2dc;color:#9a6309}.badge.bad{background:#ffe9e7;color:#9b2b2b}.badge.blue{background:#e7f0fb;color:#2b63a0}.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.test h3{font-size:13px;margin:0 0 3px}.result{font-size:11px;margin-top:5px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}dialog{border:1px solid var(--line);border-radius:15px;padding:17px;width:min(650px,94vw);box-shadow:0 18px 55px #0003}dialog::backdrop{background:#0006}.gauges{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:12px 0}.gaugebox{text-align:center}.gauge{--p:0;display:grid;place-items:center;width:148px;height:148px;margin:auto;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#ece5de 0);position:relative}.gauge:before{content:'';position:absolute;inset:13px;border-radius:50%;background:#fff}.gauge-inner{position:relative;z-index:2}.gauge-value{font-size:23px;font-weight:800}.gauge-label{font-size:11px;color:var(--muted)}.speed-note{padding:9px;border-radius:8px;background:#f1ece5;font-size:12px}@media(max-width:1050px){.kpis{grid-template-columns:repeat(4,1fr)}.dash-grid{grid-template-columns:1fr 1fr}.dash-head{grid-template-columns:1fr}.wide{grid-column:span 2}.panel{min-height:150px}}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(4,1fr)}.dash-grid{grid-template-columns:1fr 1fr}.tests{grid-template-columns:1fr 1fr}.provider-grid{grid-template-columns:1fr}.donut{width:100px;height:100px}.wide{grid-column:span 2}}@media(max-width:540px){.kpis{grid-template-columns:repeat(2,1fr)}.dash-grid,.tests,.gauges{grid-template-columns:1fr}.wide{grid-column:auto}.donut-row{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login"><section class="login-card"><div class="brand">👨‍🍳 Köcheclub Werne</div><h1 style="text-align:center">KC Communication</h1><p class="muted" style="text-align:center">Zentrale Kommunikationssteuerung · Version <b class="ver">0.4.6</b></p><div id="loginError"></div><form id="loginForm"><div class="field"><label>E-Mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Passwort</label><input id="password" type="password" autocomplete="current-password" required></div><label><input id="remember" type="checkbox"> angemeldet bleiben</label><p><button id="loginBtn" class="btn primary full">Anmelden</button></p></form></section></div><div id="app" class="app hidden"><header class="top"><div><div class="eyebrow">Köcheclub Werne</div><h1>KC Communication</h1><small class="muted">Version <b class="ver">0.4.6</b></small></div><div class="tools"><button id="updateBtn" class="btn">Updates prüfen</button><div class="dbs" title="Klick: Geschwindigkeit + Funktion"><div class="db" data-diag="idx"><span>IDX</span><i id="idxLed" class="led warn"></i><span></span><i id="idxTraffic" class="traffic"></i></div><div class="db" data-diag="sup"><span>SUP</span><i id="supLed" class="led warn"></i><span></span><i id="supTraffic" class="traffic"></i></div><div class="db" data-diag="push"><span>PUSH</span><i id="pushLed" class="led warn"></i><span></span><i id="pushTraffic" class="traffic"></i></div></div><button id="logoutBtn" class="btn danger">🚪 Abmelden</button></div></header><div id="notice" class="notice">KC Communication wird gestartet …</div><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="devices">Push-Geräte</button><button class="tab" data-tab="programs">Programme</button><button class="tab" data-tab="tests">Testcenter</button><button class="tab" data-tab="settings">Einstellungen</button></nav><main id="content"></main></div><dialog id="speedDialog"><h2 id="speedTitle">Diagnose</h2><div class="gauges"><div class="gaugebox"><div id="gauge1" class="gauge"><div class="gauge-inner"><div id="gauge1Value" class="gauge-value">–</div><div id="gauge1Label" class="gauge-label">Messwert 1</div></div></div></div><div class="gaugebox"><div id="gauge2" class="gauge"><div class="gauge-inner"><div id="gauge2Value" class="gauge-value">–</div><div id="gauge2Label" class="gauge-label">Messwert 2</div></div></div></div><div id="speedInfo" class="speed-note">Noch kein Test.</div><div class="actions" style="margin-top:11px"><button id="speedAgain" class="btn primary">Nochmals testen</button><button id="speedAll" class="btn">Alle 3 Wege testen</button><button id="speedClose" class="btn">Schließen</button></div></dialog><dialog id="updateDialog"><h2>Update vorhanden</h2><p id="updateText"></p><p style="text-align:right"><button id="laterBtn" class="btn">Später</button> <button id="installBtn" class="btn primary">Jetzt installieren</button></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const VERSION='0.4.6',SUPA='https://ptblnpiroqftcvlsrhac.supabase.co',KEY='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(v).toLocaleString('de-DE'):'–';const sb=window.supabase.createClient(SUPA,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let overview={},devices={devices:[]},health={providers:[]},currentTab='dashboard',diagKind='sup';const notice=(t,c='')=>{$('notice').textContent=t;$('notice').className='notice '+c};const flash=k=>{const e=$(k+'Traffic');if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),180)}};async function invoke(name,body={}){flash(name.includes('push')?'push':'sup');const t=performance.now(),{data,error}=await sb.functions.invoke(name,{body});if(error)throw error;return{data,ms:performance.now()-t}}async function idb(){const t=performance.now(),db=await new Promise((ok,bad)=>{const r=indexedDB.open('kc-communication-public');r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('health'))r.result.createObjectStore('health')};r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)});if(!db.objectStoreNames.contains('health')){db.close();throw new Error('Lokaler Health-Speicher fehlt – Browserdaten einmal neu laden')}await new Promise((ok,bad)=>{const tx=db.transaction('health','readwrite'),s=tx.objectStore('health');s.put(Date.now(),'probe');s.get('probe');tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)});db.close();flash('idx');return performance.now()-t}async function load(){const [o,d,h]=await Promise.all([invoke('kc-communication-console',{action:'overview'}),invoke('kc-communication-push-devices',{action:'list'}).catch(()=>({data:{devices:[]}})),invoke('kc-communication-provider-health',{}).catch(()=>({data:{providers:[]}}))]);overview=o.data||{};devices=d.data||{devices:[]};health=h.data||{providers:[]};$('supLed').className='led ok';const ph=(health.providers||[]).find(x=>x.channel==='push');$('pushLed').className='led '+(ph?.outboundReady?'ok':'warn');try{await idb();$('idxLed').className='led ok'}catch{$('idxLed').className='led bad'}}function reqState(r){const s=String(r.status||'').toLowerCase();return['sent','delivered','success','processed','ok','accepted'].includes(s)?'ok':['failed','error','rejected','dead_lettered'].includes(s)?'bad':'warn'}function pState(p,c){if(p.status==='error')return['bad','Fehler'];if(p.status==='planned')return['blue','geplant'];if(c?.status==='active'){const age=c.last_seen_at?(Date.now()-new Date(c.last_seen_at).getTime())/60000:999;if(age<5)return['ok','live'];if(age<30)return['warn','verzögert'];return['blue','kein Heartbeat']}return p.status==='active'||p.status==='ready'?['ok','aktiv']:['warn',p.status||'wartet']}function healthFor(key,channel){return(health.providers||[]).find(x=>String(x.provider||'').toLowerCase()===key&&x.channel===channel)}function providerKey(name){const n=String(name||'').toLowerCase();if(n.includes('brevo'))return'brevo';if(n.includes('resend'))return'resend';if(n.includes('web push')||n.includes('vapid'))return'web-push';return''}function providerStatus(r,p){const key=providerKey(p?.display_name||r.provider_id),h=healthFor(key,r.channel);if(!r.enabled)return['warn','inaktiv'];if(key==='resend')return['warn','Reserve'];if(key==='brevo'&&h?.productionReady)return['ok','aktiv'];if(key==='web-push'&&h?.outboundReady)return['ok','aktiv'];if(r.cost_policy==='locked_until_approved')return['blue','gesperrt'];return['warn','prüfen']}function barRows(obj,cls=''){const a=Object.entries(obj).sort((x,y)=>y[1]-x[1]),m=Math.max(1,...a.map(x=>x[1]));return'<div class="bars '+cls+'">'+(a.map(([k,v])=>'<div class="bar"><span title="'+esc(k)+'">'+esc(k)+'</span><div class="track"><div class="fill '+(k==='OK'?'ok':k.includes('Retry')?'warn':k==='Fehler'?'bad':'')+'" style="width:'+Math.max(2,Math.round(v/m*100))+'%"></div></div><b>'+v+'</b></div>').join('')||'<span class="muted">Noch keine Daten.</span>')+'</div>'}function dashboard(){const all=overview.requests||[],clients=overview.clients||[],day=all.filter(x=>new Date(x.created_at||x.sent_at||0).getTime()>Date.now()-86400000),ok=day.filter(x=>reqState(x)==='ok').length,bad=day.filter(x=>reqState(x)==='bad').length,warn=day.length-ok-bad,channels={},programs={};day.forEach(x=>{channels[x.channel||'Sonstige']=(channels[x.channel||'Sonstige']||0)+1;programs[x.source_program||'System']=(programs[x.source_program||'System']||0)+1});const ch=Object.entries(channels),total=Math.max(1,day.length),cols=['#3478c7','#24834f','#d69715','#8a55c5','#bd2f2f'];let acc=0;const stops=ch.map(([k,v],i)=>{const a=acc/total*360;acc+=v;return cols[i%cols.length]+' '+a+'deg '+acc/total*360+'deg'}).join(',');const programStrip=(overview.programs||[]).filter(p=>p.id!=='kc-communication-system').map(p=>{const c=clients.find(x=>x.source_program===p.id),s=pState(p,c);return'<span class="program-chip" title="'+esc(s[1])+'"><i class="dot '+s[0]+'"></i>'+esc(p.display_name||p.id)+'</span>'}).join('');const rs=overview.routes||[],ps=overview.providers||[];const providerStrip=rs.filter(r=>['email','push'].includes(r.channel)).map(r=>{const p=ps.find(x=>x.id===r.provider_id),s=providerStatus(r,p);return'<span class="provider-chip"><i class="dot '+s[0]+'"></i>'+esc(p?.display_name||r.provider_id)+' <span class="muted">'+s[1]+'</span></span>'}).join('');const activePush=(devices.devices||[]).filter(x=>x.active).length;$('content').innerHTML='<div class="dash-head"><section class="card program-strip"><b style="font-size:10px">PROGRAMME</b>'+programStrip+'</section><section class="card provider-mini"><b style="font-size:10px">PROVIDER</b>'+providerStrip+'</section></div><div class="kpis"><div class="kpi"><small>Vorgänge 24h</small><b>'+day.length+'</b><span class="trend">gesamt</span></div><div class="kpi"><small>OK</small><b>'+ok+'</b><span class="trend">zugestellt</span></div><div class="kpi"><small>Retry/Warn</small><b>'+warn+'</b><span class="trend">prüfen</span></div><div class="kpi"><small>Fehler</small><b>'+bad+'</b><span class="trend">kritisch</span></div><div class="kpi"><small>Erfolgsquote</small><b>'+(day.length?Math.round(ok/day.length*1000)/10+'%':'–')+'</b><span class="trend">24 Stunden</span></div><div class="kpi"><small>Programme</small><b>'+(overview.programs||[]).length+'</b><span class="trend">registriert</span></div><div class="kpi"><small>Push-Geräte</small><b>'+activePush+'</b><span class="trend">aktiv</span></div><div class="kpi"><small>Version</small><b>'+VERSION+'</b><span class="trend">aktuell</span></div></div><div class="dash-grid"><section class="card panel"><h3>Versand nach Kanal</h3><div class="panel-sub">letzte 24 Stunden</div><div class="donut-row"><div class="donut" style="background:conic-gradient('+(stops||'#ddd 0 360deg')+')"></div><div class="legend">'+(ch.map(([k,v],i)=>'<span style="color:'+cols[i%cols.length]+'">● <b style="color:#292625">'+esc(k)+': '+v+'</b></span>').join('')||'<span class="muted">Noch keine Vorgänge</span>')+'</div></div></section><section class="card panel"><h3>Versand nach Programm</h3><div class="panel-sub">Volumen der letzten 24 Stunden</div>'+barRows(programs)+'</section><section class="card panel"><h3>Status</h3><div class="panel-sub">OK / Retry / Fehler</div>'+barRows({OK:ok,'Retry/Warn':warn,Fehler:bad},'status-bars')+'</section><section class="card panel"><h3>Provider-Monitor</h3><div class="panel-sub">produktive Wege und Reserven</div><div class="provider-grid">'+rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),s=providerStatus(r,p);return'<div class="provider-box"><b><i class="dot '+s[0]+'"></i> '+esc(p?.display_name||r.provider_id)+'</b><span>'+esc((r.channel||'').toUpperCase())+' · '+s[1]+'</span></div>'}).join('')+'</div></section><section class="card panel wide"><h3>Letzte Kommunikation</h3><div class="panel-sub">neueste Ereignisse</div><div class="recent-list">'+(all.slice(0,7).map(r=>'<div class="recent"><i class="dot '+reqState(r)+'"></i><div class="recent-main"><b>'+esc(r.source_program||'System')+'</b> · '+esc(r.channel||'')+' · '+esc(r.status||'')+'</div><div class="recent-time">'+fmt(r.sent_at||r.created_at).split(',')[1]?.trim()+'</div></div>').join('')||'<span class="muted">Noch keine Transfers.</span>')+'</div></section></div>'}function settings(){const rs=overview.routes||[],ps=overview.providers||[];$('content').innerHTML='<section class="card section"><h2>Provider & Versandwege</h2><p class="muted">Brevo primär; Resend deaktivierte Reserve. Failover nur nach freigegebenen Regeln.</p>'+rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),s=providerStatus(r,p);return'<div class="provider"><span class="statusline"><i class="dot '+s[0]+'"></i><b>'+esc((r.channel||'').toUpperCase())+' · '+esc(p?.display_name||r.provider_id)+'</b><span class="badge '+s[0]+'">'+s[1]+'</span></span><div class="muted">'+esc(r.role||'')+' · Priorität '+esc(r.priority)+' · Route: '+(r.enabled?'freigegeben':'gesperrt')+' · Failover: '+(r.auto_failover?'ja':'nein')+' · Kostenregel: '+esc(r.cost_policy||'–')+'</div></div>'}).join('')+'</section>'}function devicesView(){const ds=devices.devices||[];$('content').innerHTML='<section class="card section"><h2>Push-Geräte</h2><p class="muted">Verständliche Gerätenamen; technische IDs werden nicht als Gerätename angezeigt.</p>'+(ds.map((d,i)=>'<div class="device"><span class="statusline"><i class="dot '+(d.active?'ok':'warn')+'"></i><b>'+esc(d.label||('Push-Gerät '+(i+1)))+'</b><span class="badge '+(d.active?'ok':'warn')+'">'+(d.active?'aktiv':'inaktiv')+'</span></span><div class="muted">Letzter Kontakt: '+fmt(d.lastSeenAt||d.updatedAt)+'</div></div>').join('')||'<p class="muted">Noch keine Push-Geräte registriert.</p>')+'</section>'}function programsView(){const cs=overview.clients||[];$('content').innerHTML='<section class="card section"><h2>Programme & Anbindungen</h2>'+((overview.programs||[]).map(p=>{const c=cs.find(x=>x.source_program===p.id),s=pState(p,c);return'<div class="program"><span class="statusline"><i class="dot '+s[0]+'"></i><b>'+esc(p.display_name||p.id)+'</b><span class="badge '+s[0]+'">'+s[1]+'</span></span><div class="muted">Kanäle: '+esc((p.allowed_channels||[]).join(', ')||'keine')+' · Client: '+esc(c?.device_name||'noch keiner')+' · letzter Kontakt: '+fmt(c?.last_seen_at)+'</div></div>'}).join('')||'Keine Programme')+'</section>'}function setGauge(id,val,max,label){const n=Math.max(0,Number(val)||0),p=Math.max(2,Math.min(100,n/max*100));$(id).style.setProperty('--p',p);$(id+'Value').textContent=Math.round(n)+' ms';$(id+'Label').textContent=label}async function runSpeed(kind){diagKind=kind;$('speedTitle').textContent=kind==='idx'?'IndexedDB – Geschwindigkeit & Funktion':kind==='sup'?'Supabase – Geschwindigkeit & Funktion':'Push – Geschwindigkeit & Funktion';$('speedInfo').textContent='Messung läuft …';$('speedDialog').showModal();try{let a=0,b=0,info='';if(kind==='idx'){const t=performance.now();a=await idb();b=performance.now()-t;info='Lokaler Schreib-/Lesezugriff erfolgreich.';$('idxLed').className='led ok';setGauge('gauge1',a,500,'IndexedDB Zugriff');setGauge('gauge2',b,500,'Gesamtlaufzeit')}else if(kind==='sup'){const r=await invoke('kc-communication-console',{action:'health'});a=Number(r.data?.dbMs||0);b=r.ms;info=r.data?.ok===false?'Datenbank meldet Fehler.':'Supabase und zentrale Datenbank antworten.';$('supLed').className='led ok';setGauge('gauge1',a,1000,'DB intern');setGauge('gauge2',b,1000,'Browser → Supabase')}else{const r=await invoke('kc-communication-provider-health',{});b=r.ms;const p=(r.data?.providers||[]).find(x=>x.channel==='push');a=p?.outboundReady?Math.min(b,50):b;info=p?.outboundReady?'Web Push / VAPID versandbereit.':'Push erreichbar, aber nicht vollständig versandbereit.';$('pushLed').className='led '+(p?.outboundReady?'ok':'warn');setGauge('gauge1',a,1000,'Provider-Reaktion');setGauge('gauge2',b,1000,'Gesamtlaufzeit')}$('speedInfo').textContent=info}catch(e){$(kind+'Led').className='led bad';$('speedInfo').textContent='Test fehlgeschlagen: '+(e.message||e)}}async function runAllSpeed(){for(const k of['idx','sup','push'])await runSpeed(k);notice('Alle 3 Geschwindigkeits- und Funktionstests abgeschlossen.','success')}async function testOne(id){const box=$('res'+id);box.className='result';box.textContent='läuft …';try{let t='';if(id===1){const a=await idb(),b=await invoke('kc-communication-console',{action:'health'});t='IndexedDB '+Math.round(a)+' ms · Supabase '+Math.round(b.ms)+' ms'}else if(id===2){if(!(await sb.auth.getSession()).data.session)throw Error('keine gültige Sitzung');t='Sitzung und Auth-Token gültig'}else if(id===3){const h=await invoke('kc-communication-provider-health',{});t='Provider-Health erreichbar · '+(h.data.providers||[]).filter(x=>x.outboundReady).length+' versandbereit'}else if(id===4)t='Zustell-/Fehlerstatus lesbar · '+(overview.requests||[]).filter(x=>reqState(x)==='bad').length+' Fehler im Abruf';else if(id===5)t=(overview.routes||[]).filter(x=>x.auto_failover).length+' Failover-Routen konfiguriert; keine echte Störung ausgelöst';else if(id===6)t=(overview.routes||[]).length+' Versandrouten geprüft';else if(id===7)t=(overview.programs||[]).length+' Programme und Kanalrechte geladen';else if(id===8)t=(overview.requests||[]).length+' Queue-/Retry-Vorgänge lesbar';else if(id===9){if(location.protocol!=='https:')throw Error('HTTPS fehlt');t='HTTPS aktiv; keine Service-Role im Browser'}else{await idb();await invoke('kc-communication-console',{action:'overview'});t='lokale und zentrale Datenbank erfolgreich geprüft'}box.className='result ok';box.textContent='✓ '+t;return true}catch(e){box.className='result bad';box.textContent='✗ '+(e.message||e);return false}}function testsView(){$('content').innerHTML='<section class="card section"><h2>Testcenter</h2><div class="actions"><button id="speedIdx" class="btn">IDX Rundinstrument</button><button id="speedSup" class="btn">SUP Rundinstrument</button><button id="speedPush" class="btn">PUSH Rundinstrument</button><button id="allTests" class="btn primary">Alle 10 Funktionstests</button></div><p class="muted">Geschwindigkeitstests mit Rundinstrumenten plus Funktions-, Provider-, Failover-, Sicherheits- und Datenbanktests.</p><div class="tests">'+[['Verbindungen','IDX + Supabase'],['Authentifizierung','Sitzung und Token'],['Provider-Health','Brevo, Resend, Push'],['Zustellstatus','Erfolg/Fehler'],['Failover','Konfiguration'],['Routen/Kanäle','Regeln und Sperren'],['Programme/Rechte','Registrierung/Kanäle'],['Queue/Retry','Warteschlange'],['Sicherheit','HTTPS/Client'],['Datenbanken','lokal + zentral']].map((x,i)=>'<div class="test"><h3>'+(i+1)+'. '+x[0]+'</h3><div class="muted">'+x[1]+'</div><p><button class="btn" data-test="'+(i+1)+'">Test starten</button></p><div id="res'+(i+1)+'" class="result">noch nicht getestet</div></div>').join('')+'</div></section>';document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>testOne(+b.dataset.test));$('speedIdx').onclick=()=>runSpeed('idx');$('speedSup').onclick=()=>runSpeed('sup');$('speedPush').onclick=()=>runSpeed('push');$('allTests').onclick=async()=>{let n=0;for(let i=1;i<=10;i++)if(await testOne(i))n++;notice('Testlauf abgeschlossen: '+n+'/10 erfolgreich.',n===10?'success':'error')}}function render(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({dashboard,devices:devicesView,programs:programsView,tests:testsView,settings}[tab]||dashboard)()}async function updateCheck(silent=false){try{const r=await fetch('./releases/latest.json?t='+Date.now(),{cache:'no-store'}),m=await r.json();const A=String(m.version||'0').split('.').map(Number),B=VERSION.split('.').map(Number);let newer=false;for(let i=0;i<3;i++){if((A[i]||0)>(B[i]||0)){newer=true;break}if((A[i]||0)<(B[i]||0))break}if(!newer){if(!silent)notice('KC Communication '+VERSION+' ist aktuell.','success');return}$('updateText').textContent='Version '+m.version+' ist verfügbar. '+(m.notes||'');$('installBtn').dataset.url=m.releaseUrl||'./';$('updateDialog').showModal()}catch(e){if(!silent)notice('Update-Prüfung nicht möglich: '+e.message,'error')}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));document.querySelectorAll('[data-diag]').forEach(b=>b.onclick=()=>runSpeed(b.dataset.diag));$('speedAgain').onclick=()=>runSpeed(diagKind);$('speedAll').onclick=runAllSpeed;$('speedClose').onclick=()=>$('speedDialog').close();$('laterBtn').onclick=()=>$('updateDialog').close();$('installBtn').onclick=()=>{const u=$('installBtn').dataset.url;if(u)location.href=u};$('updateBtn').onclick=()=>updateCheck(false);$('logoutBtn').onclick=async()=>{await sb.auth.signOut();localStorage.removeItem('kc_comm_remember');location.reload()};$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return}if($('remember').checked)localStorage.setItem('kc_comm_remember','1');await enter(data.session)};async function enter(s){if(!s)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{await load();render(currentTab);notice('KC Communication '+VERSION+' bereit.','success');setTimeout(()=>updateCheck(true),800)}catch(e){notice('Startfehler: '+(e.message||e),'error')}};(async()=>{const s=(await sb.auth.getSession()).data.session;if(s)await enter(s)})();})();</script></body></html>
