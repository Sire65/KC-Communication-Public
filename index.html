<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#741521"><title>KC Communication</title>
<style>
:root{--b:#741521;--bg:#f5f2ed;--card:#fff;--ink:#292625;--muted:#6d6966;--line:#ded6cd;--ok:#24834f;--warn:#d69715;--bad:#bd2f2f;--blue:#3478c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(620px,95vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px 34px;box-shadow:0 16px 42px #4c37231c}.brand{text-align:center;color:var(--b)}.hat{font-size:56px}.club{font:700 34px Georgia,serif}.since{font:600 13px Georgia,serif;color:#222}.login-card h1{text-align:center;color:var(--b)}.field{display:grid;gap:6px;margin:12px 0}.field input{min-height:50px;border:1px solid #ccc3ba;border-radius:12px;padding:0 14px;font-size:17px}.check{display:flex;gap:8px;align-items:center;margin:12px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;min-height:40px;font-weight:700;cursor:pointer}.btn.primary{background:var(--b);color:#fff;border-color:var(--b)}.btn.danger{color:var(--bad)}.full{width:100%;min-height:52px}.note{border-radius:11px;padding:10px 12px;background:#f1ece5;margin-top:11px}.note.error{background:#fff0ef;color:#962d2d}.app{max-width:1500px;margin:auto;padding:15px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:2px 0;color:var(--b)}.eyebrow,.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dbs{display:flex;border:1px solid var(--line);background:#fff;border-radius:10px;overflow:hidden}.db{display:grid;grid-template-columns:auto 10px;grid-template-rows:auto 10px;gap:2px 6px;align-items:center;padding:6px 9px;border-right:1px solid var(--line);font-size:10px;font-weight:800;cursor:pointer}.db:last-child{border-right:0}.led,.traffic,.p-led{display:inline-block;width:10px;height:10px;border-radius:50%;background:#999}.led.ok,.p-led.ok{background:var(--ok);box-shadow:0 0 7px var(--ok)}.led.warn,.p-led.warn{background:var(--warn)}.led.bad,.p-led.bad{background:var(--bad)}.led.blue,.p-led.blue{background:var(--blue)}.traffic{opacity:.22;background:#e8a500}.traffic.flash{opacity:1;box-shadow:0 0 8px #e8a500}.notice{margin:12px 0;border-radius:10px;padding:10px 12px;background:#edf4fb}.notice.success{background:#eaf6ee;color:#246d45}.notice.error{background:#fff0ef;color:#922e2e}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;font-weight:700;cursor:pointer}.tab.active{background:var(--b);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.card h2,.card h3{margin-top:0}.dash-programs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.dash-program{font-size:12px;display:inline-flex;gap:5px;align-items:center}.kpis{display:grid;grid-template-columns:repeat(8,minmax(80px,1fr));gap:7px;margin-bottom:8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}.kpi span{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}.kpi b{display:block;font-size:20px;margin-top:3px}.dash-grid{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:8px}.wide{grid-column:span 2}.mini-bars{display:grid;gap:5px}.bar{display:grid;grid-template-columns:95px 1fr 32px;gap:6px;align-items:center;font-size:11px}.bar>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-track{height:8px;background:#eee;border-radius:20px;overflow:hidden}.bar-fill{height:100%;background:#667085}.health{display:grid;gap:8px}.health span{display:flex;gap:7px;align-items:center}.program{border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:8px}.program-grid{display:grid;grid-template-columns:minmax(180px,1.2fr) repeat(3,minmax(130px,1fr)) auto;gap:10px;align-items:center}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eee}.badge.ok{background:#e7f4eb;color:#237447}.badge.warn{background:#fff2dc;color:#9a6309}.badge.bad{background:#ffe9e7;color:#9b2b2b}.badge.blue{background:#e7f0fb;color:#2b63a0}.provider{border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.diag{border:1px solid var(--line);border-radius:11px;padding:12px}.big{font-size:30px;font-weight:800;color:var(--b)}dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(650px,94vw)}dialog::backdrop{background:#0006}@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.dash-grid{grid-template-columns:1fr 1fr}.program-grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}.dash-grid,.grid2,.program-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<div id="login" class="login"><section class="login-card"><div class="brand"><div class="hat">👨‍🍳</div><div class="since">since 1991</div><div class="club">Köcheclub Werne</div></div><h1>KC Communication</h1><p class="muted" style="text-align:center">Zentrale Kommunikationssteuerung</p><div id="loginError"></div><form id="loginForm"><div class="field"><label>E-Mail-Adresse</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Passwort</label><input id="password" type="password" autocomplete="current-password" required></div><label class="check"><input id="remember" type="checkbox"> Auf diesem Gerät angemeldet bleiben</label><button id="loginBtn" class="btn primary full">Anmelden</button></form><div class="note">Version <b class="appVersion">0.4.1</b> · Updateprüfung nur bei tatsächlich neuer Version.</div></section></div>
<div id="app" class="app hidden"><header class="top"><div><div class="eyebrow">Köcheclub Werne</div><h1>KC Communication</h1><div class="muted">Version <span class="appVersion">0.4.1</span></div></div><div class="tools"><button id="updateBtn" class="btn">Updates prüfen</button><div class="dbs"><div class="db" data-diag="idx">IDX <i id="idxLed" class="led warn"></i><i id="idxTraffic" class="traffic"></i></div><div class="db" data-diag="sup">SUP <i id="supLed" class="led warn"></i><i id="supTraffic" class="traffic"></i></div><div class="db" data-diag="push">PUSH <i id="pushLed" class="led warn"></i><i id="pushTraffic" class="traffic"></i></div></div><button id="logoutBtn" class="btn danger">🚪 Abmelden</button></div></header><div id="notice" class="notice">KC Communication wird gestartet …</div><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="devices">Push-Geräte</button><button class="tab" data-tab="programs">Programme</button><button class="tab" data-tab="tests">Testcenter</button><button class="tab" data-tab="settings">Einstellungen</button></nav><main id="content"></main></div>
<dialog id="updateDialog"><h2>Update vorhanden</h2><p id="updateText"></p><div class="actions" style="justify-content:flex-end"><button id="laterBtn" class="btn">Später</button><button id="installBtn" class="btn primary">Jetzt installieren</button></div></dialog>
<dialog id="diagDialog"><h2 id="diagTitle">Diagnose</h2><div id="diagBody"></div><div class="actions" style="margin-top:12px"><button id="diagAgain" class="btn primary">Nochmals testen</button><button id="diagClose" class="btn">Schließen</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const VERSION='0.4.1',SUPA='https://ptblnpiroqftcvlsrhac.supabase.co',KEY='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(v).toLocaleString('de-DE'):'–';const sb=window.supabase.createClient(SUPA,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let session=null,overview=null,devicesData=null,active='dashboard',diagKind='sup';
const notice=(t,type='')=>{$('notice').textContent=t;$('notice').className='notice '+type};const flash=k=>{const e=$(k+'Traffic');if(!e)return;e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),250)};async function invoke(name,body={}){flash(name.includes('push')?'push':'sup');const t=performance.now();const {data,error}=await sb.functions.invoke(name,{body});if(error)throw error;return{data,total:performance.now()-t}}
function cmp(a,b){const A=String(a).split('.').map(Number),B=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((A[i]||0)!==(B[i]||0))return(A[i]||0)-(B[i]||0)}return 0}async function updateCheck(silent=false){try{const r=await fetch('./releases/latest.json?t='+Date.now(),{cache:'no-store'}),m=await r.json();if(cmp(m.version,VERSION)<=0){if(!silent)notice('KC Communication '+VERSION+' ist aktuell.','success');return} $('updateText').textContent='Version '+m.version+' ist verfügbar. '+(m.notes||'');$('installBtn').dataset.url=m.releaseUrl||'./';$('updateDialog').showModal()}catch(e){if(!silent)notice('Update-Prüfung nicht möglich: '+e.message,'error')}}$('laterBtn').onclick=()=>$('updateDialog').close();$('installBtn').onclick=()=>{const u=$('installBtn').dataset.url;if(u){$('updateDialog').close();location.href=u}};$('updateBtn').onclick=()=>updateCheck(false);
async function testIDB(){const t=performance.now();const db=await new Promise((ok,bad)=>{const r=indexedDB.open('kc-communication-public',3);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('health'))r.result.createObjectStore('health')};r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)});await new Promise((ok,bad)=>{const tx=db.transaction('health','readwrite'),s=tx.objectStore('health');s.put(Date.now(),'probe');s.get('probe');tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)});db.close();flash('idx');return performance.now()-t}
async function loadAll(){try{const [o,d]=await Promise.all([invoke('kc-communication-console',{action:'overview'}),invoke('kc-communication-push-devices',{action:'list'}).catch(()=>({data:{devices:[]}}))]);overview=o.data||{};devicesData=d.data||{};$('supLed').className='led ok';$('pushLed').className='led '+((devicesData.devices||[]).some(x=>x.active)?'ok':'warn');try{await testIDB();$('idxLed').className='led ok'}catch{$('idxLed').className='led bad'}return true}catch(e){$('supLed').className='led bad';notice('Zentrale Daten konnten nicht geladen werden: '+e.message,'error');return false}}
function status(s){return String(s||'').toLowerCase()}function okReq(r){return['sent','delivered','success','processed','ok','accepted'].includes(status(r.status))}function badReq(r){return['failed','error','rejected','dead_lettered'].includes(status(r.status))}function retryReq(r){return['retry','retry_scheduled','partial'].includes(status(r.status))}function rowTime(r){return new Date(r.created_at||r.sent_at||r.processed_at||0).getTime()||0}function pstate(p,c){if(p.status==='planned')return['','geplant'];if(!c)return['blue','registriert / noch kein Client'];const age=c.last_seen_at?(Date.now()-new Date(c.last_seen_at).getTime())/60000:9999;if(c.status!=='active')return['blue','wartet / registriert'];if(age<=5)return['ok','live verbunden'];if(age<=30)return['warn','Kontakt verzögert'];return['bad','Heartbeat fehlt']}
function group(rows,key){const m=new Map();for(const r of rows){const k=String(r[key]||'unbekannt');m.set(k,(m.get(k)||0)+1)}return[...m.entries()].sort((a,b)=>b[1]-a[1])}function bars(rows){const max=Math.max(1,...rows.map(x=>x[1]));return'<div class="mini-bars">'+(rows.map(([n,v])=>'<div class="bar"><span title="'+esc(n)+'">'+esc(n)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,v/max*100)+'%"></div></div><b>'+v+'</b></div>').join('')||'<span class="muted">Noch keine Daten.</span>')+'</div>'}
function dashboard(){const ps=overview?.programs||[],cs=overview?.clients||[],req=[...(overview?.requests||[])].sort((a,b)=>rowTime(b)-rowTime(a));const day=req.filter(r=>rowTime(r)>Date.now()-86400000),ok=day.filter(okReq).length,bad=day.filter(badReq).length,retry=day.filter(retryReq).length,total=day.length,ds=devicesData?.devices||[];const strip=ps.filter(p=>p.id!=='kc-communication-system').map(p=>{const c=cs.find(x=>x.source_program===p.id),st=pstate(p,c);return'<span class="dash-program"><i class="p-led '+st[0]+'"></i>'+esc(p.display_name||p.id)+'</span>'}).join('');const channels=group(day,'channel').slice(0,6),programs=group(day,'source_program').slice(0,7);$('content').innerHTML='<section><div class="card dash-programs"><b>Programme</b>'+strip+'</div><div class="kpis"><div class="kpi"><span>Vorgänge 24h</span><b>'+total+'</b></div><div class="kpi"><span>OK</span><b>'+ok+'</b></div><div class="kpi"><span>Retry/Teil</span><b>'+retry+'</b></div><div class="kpi"><span>Fehler</span><b>'+bad+'</b></div><div class="kpi"><span>Erfolgsquote</span><b>'+(total?Math.round(ok/total*1000)/10+'%':'–')+'</b></div><div class="kpi"><span>Programme</span><b>'+ps.length+'</b></div><div class="kpi"><span>Push-Geräte</span><b>'+ds.filter(x=>x.active).length+'</b></div><div class="kpi"><span>Version</span><b>'+VERSION+'</b></div></div><div class="dash-grid"><article class="card"><h3>Versand nach Kanal</h3>'+bars(channels)+'</article><article class="card"><h3>Nach Programm</h3>'+bars(programs)+'</article><article class="card"><h3>Aktueller Zustand</h3><div class="health"><span><i class="p-led ok"></i>KC Core erreichbar</span><span><i class="p-led '+($('supLed').classList.contains('ok')?'ok':'bad')+'"></i>Supabase</span><span><i class="p-led '+($('pushLed').classList.contains('ok')?'ok':'warn')+'"></i>Push</span><span><i class="p-led '+($('idxLed').classList.contains('ok')?'ok':'bad')+'"></i>IndexedDB</span></div></article><article class="card wide"><h3>Letzte Kommunikation</h3>'+(req.slice(0,8).map(r=>'<div style="padding:5px 0;border-bottom:1px solid #eee"><b>'+esc(r.source_program||'System')+'</b> · '+esc(r.channel||'')+' · '+esc(r.status||'')+' <span class="muted">'+fmt(r.sent_at||r.created_at)+'</span></div>').join('')||'<span class="muted">Noch keine Transfers.</span>')+'</article></div></section>'}
async function renderPrograms(){await loadAll();const ps=overview?.programs||[],cs=overview?.clients||[],req=overview?.requests||[];$('content').innerHTML='<section class="card"><h2>Programme & Anbindungen</h2><p class="muted">Grün = live · Gelb = verzögert · Rot = offline/Fehler · Blau = registriert/freigegeben ohne aktuellen Heartbeat.</p>'+ps.map(p=>{const c=cs.find(x=>x.source_program===p.id),st=pstate(p,c),q=req.find(x=>x.source_program===p.id);return'<div class="program"><div class="program-grid"><div><i class="p-led '+st[0]+'"></i> <b>'+esc(p.display_name||p.id)+'</b><div><span class="badge '+st[0]+'">'+st[1]+'</span></div></div><div><b>Client</b><br>'+esc(c?.device_name||'noch keiner')+'</div><div><b>Letzter Kontakt</b><br>'+fmt(c?.last_seen_at)+'</div><div><b>Letzte Nachricht</b><br>'+fmt(q?.sent_at||q?.created_at)+'</div><div><button class="btn" onclick="location.reload()">Neu prüfen</button></div></div></div>'}).join('')+'</section>'}
async function renderDevices(){await loadAll();const ds=devicesData?.devices||[];$('content').innerHTML='<section class="card"><h2>Push-Geräte</h2>'+(ds.map(d=>'<div class="program"><b>'+esc(d.label||d.device_name||'Gerät')+'</b> <span class="badge '+(d.active?'ok':'warn')+'">'+(d.active?'aktiv':'inaktiv')+'</span><div class="muted">Letzter Kontakt: '+fmt(d.lastSeenAt||d.last_seen_at)+'</div></div>').join('')||'<p class="muted">Noch keine Geräte.</p>')+'</section>'}
async function renderSettings(){await loadAll();const rs=overview?.routes||[],ps=overview?.providers||[];$('content').innerHTML='<section class="card"><h2>Provider & Versandwege</h2><p class="muted">Failover nur innerhalb freigegebener Kostenregeln.</p>'+rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),cl=!r.enabled?'warn':r.health_status==='bad'?'bad':'ok';return'<div class="provider"><i class="p-led '+cl+'"></i> <b>'+esc((r.channel||'').toUpperCase())+' · '+esc(p?.display_name||r.provider_id)+'</b> <span class="badge '+cl+'">'+esc(r.role||'')+' / Priorität '+esc(r.priority)+'</span><div class="muted">Aktiv: '+(r.enabled?'ja':'nein')+' · Auto-Failover: '+(r.auto_failover?'ja':'nein')+' · Kostenregel: '+esc(r.cost_policy||'')+' · Health: '+esc(r.health_status||'unbekannt')+'</div></div>'}).join('')+'</section>'}
function renderTests(){$('content').innerHTML='<section class="grid2"><div class="card"><h2>Verbindungstests</h2><p>IDX, SUP und PUSH oben anklicken oder alle nacheinander prüfen.</p><button id="allTests" class="btn primary">Alle Wege testen</button></div><div class="card"><h2>Bewertung</h2><p><b style="color:var(--ok)">Grün</b> = fehlerfrei · <b style="color:var(--warn)">Gelb</b> = erreichbar, prüfen · <b style="color:var(--bad)">Rot</b> = Fehler</p></div></section>';$('allTests').onclick=async()=>{for(const k of['idx','sup','push'])await runDiag(k);notice('Alle Wege getestet.','success')}}
async function runDiag(k){diagKind=k;$('diagTitle').textContent=k==='idx'?'IndexedDB Diagnose':k==='sup'?'Supabase Diagnose':'Push Diagnose';$('diagBody').innerHTML='<div class="diag">Messung läuft …</div>';$('diagDialog').showModal();try{const t=performance.now();let text='';if(k==='idx'){const ms=await testIDB();text='<div class="big">'+Math.round(ms)+' ms</div><p>Lokaler Schreib-/Lesezugriff erfolgreich.</p>';$('idxLed').className='led ok'}else if(k==='sup'){const r=await invoke('kc-communication-console',{action:'health'});text='<div class="big">'+Math.round(r.total)+' ms</div><p>Supabase / KC Communication erreichbar.</p>';$('supLed').className='led ok'}else{const r=await invoke('kc-communication-provider-health',{});text='<div class="big">'+Math.round(r.total)+' ms</div><p>Provider-Health erreichbar.</p>';$('pushLed').className='led '+((r.data?.providers||[]).some(x=>x.channel==='push'&&x.outboundReady)?'ok':'warn')} $('diagBody').innerHTML='<div class="diag">'+text+'<span class="badge ok">Test erfolgreich</span></div>'}catch(e){$('diagBody').innerHTML='<div class="note error">Test fehlgeschlagen: '+esc(e.message||e)+'</div>';$(k+'Led').className='led bad'}}document.querySelectorAll('[data-diag]').forEach(x=>x.onclick=()=>runDiag(x.dataset.diag));$('diagAgain').onclick=()=>runDiag(diagKind);$('diagClose').onclick=()=>$('diagDialog').close();
async function render(tab){active=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='dashboard'){await loadAll();return dashboard()}if(tab==='devices')return renderDevices();if(tab==='programs')return renderPrograms();if(tab==='tests')return renderTests();if(tab==='settings')return renderSettings()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Anmeldung läuft …';$('loginError').innerHTML='';try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;if($('remember').checked)localStorage.setItem('kc_comm_remember','1');$('login').classList.add('hidden');$('app').classList.remove('hidden');await render('dashboard');notice('KC Communication ist angemeldet.','success')}catch(err){$('loginError').innerHTML='<div class="note error">'+esc(err.message||err)+'</div>';b.disabled=false;b.textContent='Anmelden'}};$('logoutBtn').onclick=async()=>{if(!confirm('KC Communication wirklich abmelden?'))return;await sb.auth.signOut();localStorage.removeItem('kc_comm_remember');location.reload()};
(async()=>{document.querySelectorAll('.appVersion').forEach(x=>x.textContent=VERSION);if(localStorage.getItem('kc_comm_remember')==='1'){session=(await sb.auth.getSession()).data.session;if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');await render('dashboard');notice('KC Communication ist angemeldet.','success')}}setTimeout(()=>updateCheck(true),1000)})();
})();</script></body></html>
