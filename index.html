<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC Communication</title><style>:root{--b:#741521;--bg:#f5f2ed;--line:#ddd4ca;--ok:#24834f;--warn:#d69715;--bad:#bd2f2f;--blue:#3478c7;--muted:#6d6966}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:#292625}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.login-card{width:min(600px,94vw);padding:28px}.brand{text-align:center;color:var(--b);font:700 32px Georgia}.muted{color:var(--muted)}.field{display:grid;gap:5px;margin:12px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:9px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary,.tab.active{background:var(--b);color:#fff}.full{width:100%}.app{max-width:1500px;margin:auto;padding:14px}.top,.tools,.tabs,.actions,.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.top h1{color:var(--b);margin:3px 0}.notice{margin:10px 0;padding:10px;border-radius:9px;background:#edf4fb}.notice.success{background:#eaf6ee;color:#246d45}.notice.error{background:#fff0ef;color:#922e2e}.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;font-weight:700}.dbs{display:flex;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.db{min-width:72px;padding:6px 8px;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 12px;grid-template-rows:16px 14px;column-gap:6px;align-items:center;font-size:10px;font-weight:800;cursor:pointer}.db:last-child{border-right:0}.db .traffic-label{font-size:9px;color:var(--muted);font-weight:600;grid-column:1}.led,.traffic{width:10px;height:10px;border-radius:50%;display:inline-block;background:#999}.led.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}.led.warn{background:var(--warn)}.led.bad{background:var(--bad)}.led.blue{background:var(--blue)}.traffic{background:#e8a500;opacity:.22}.traffic.flash{opacity:1;box-shadow:0 0 7px #e8a500}.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}.kpi small{color:var(--muted)}.kpi b{display:block;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.program,.provider,.test{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eee}.badge.ok{background:#e7f4eb;color:#237447}.badge.warn{background:#fff2dc;color:#9a6309}.badge.bad{background:#ffe9e7;color:#9b2b2b}.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.test h3{margin:0 0 5px;font-size:15px}.result{margin-top:7px;font-size:12px}.result.ok{color:var(--ok)}.result.warn{color:var(--warn)}.result.bad{color:var(--bad)}dialog{border:1px solid var(--line);border-radius:14px;width:min(650px,94vw)}@media(max-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}.tests{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:600px){.kpis,.tests{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login"><section class="login-card"><div class="brand">👨‍🍳 Köcheclub Werne</div><h1 style="text-align:center">KC Communication</h1><p class="muted" style="text-align:center">Zentrale Kommunikationssteuerung · Version <b class="ver">0.4.2</b></p><div id="loginError"></div><form id="loginForm"><div class="field"><label>E-Mail</label><input id="email" type="email" required></div><div class="field"><label>Passwort</label><input id="password" type="password" required></div><label><input id="remember" type="checkbox"> angemeldet bleiben</label><p><button id="loginBtn" class="btn primary full">Anmelden</button></p></form></section></div><div id="app" class="app hidden"><header class="top"><div><small class="muted">Köcheclub Werne</small><h1>KC Communication</h1><small>Version <b class="ver">0.4.2</b></small></div><div class="tools"><button id="updateBtn" class="btn">Updates prüfen</button><div class="dbs"><div class="db" data-diag="idx"><span>IDX</span><i id="idxLed" class="led warn"></i><span class="traffic-label">Traffic</span><i id="idxTraffic" class="traffic"></i></div><div class="db" data-diag="sup"><span>SUP</span><i id="supLed" class="led warn"></i><span class="traffic-label">Traffic</span><i id="supTraffic" class="traffic"></i></div><div class="db" data-diag="push"><span>PUSH</span><i id="pushLed" class="led warn"></i><span class="traffic-label">Traffic</span><i id="pushTraffic" class="traffic"></i></div></div><button id="logoutBtn" class="btn">🚪 Abmelden</button></div></header><div id="notice" class="notice">Start …</div><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="devices">Push-Geräte</button><button class="tab" data-tab="programs">Programme</button><button class="tab" data-tab="tests">Testcenter</button><button class="tab" data-tab="settings">Einstellungen</button></nav><main id="content"></main></div><dialog id="diag"><h2 id="diagTitle">Diagnose</h2><div id="diagBody"></div><p><button class="btn" onclick="this.closest('dialog').close()">Schließen</button></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const VERSION='0.4.2',SUPA='https://ptblnpiroqftcvlsrhac.supabase.co',KEY='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24',$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sb=window.supabase.createClient(SUPA,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let overview={},devices={devices:[]},session=null;const notice=(t,c='')=>{$('notice').textContent=t;$('notice').className='notice '+c};const flash=k=>{const e=$(k+'Traffic');if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),250)}};async function invoke(n,b={}){flash(n.includes('push')?'push':'sup');const t=performance.now(),{data,error}=await sb.functions.invoke(n,{body:b});if(error)throw error;return{data,ms:performance.now()-t}}async function idb(){const t=performance.now(),db=await new Promise((ok,bad)=>{const r=indexedDB.open('kc-communication-public',4);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('health'))r.result.createObjectStore('health')};r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)});await new Promise((ok,bad)=>{const tx=db.transaction('health','readwrite'),s=tx.objectStore('health');s.put(Date.now(),'probe');s.get('probe');tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)});db.close();flash('idx');return performance.now()-t}async function load(){const [o,d]=await Promise.all([invoke('kc-communication-console',{action:'overview'}),invoke('kc-communication-push-devices',{action:'list'}).catch(()=>({data:{devices:[]}}))]);overview=o.data||{};devices=d.data||{devices:[]};$('supLed').className='led ok';$('pushLed').className='led '+((devices.devices||[]).some(x=>x.active)?'ok':'warn');try{await idb();$('idxLed').className='led ok'}catch{$('idxLed').className='led bad'}}function reqState(r){const s=String(r.status||'').toLowerCase();return['sent','delivered','success','processed','ok','accepted'].includes(s)?'ok':['failed','error','rejected','dead_lettered'].includes(s)?'bad':'warn'}function dashboard(){const r=overview.requests||[],day=r.filter(x=>new Date(x.created_at||x.sent_at||0)>Date.now()-86400000),ok=day.filter(x=>reqState(x)==='ok').length,bad=day.filter(x=>reqState(x)==='bad').length;$('content').innerHTML='<div class="kpis"><div class="kpi"><small>Vorgänge 24h</small><b>'+day.length+'</b></div><div class="kpi"><small>OK</small><b>'+ok+'</b></div><div class="kpi"><small>Warn/Retry</small><b>'+(day.length-ok-bad)+'</b></div><div class="kpi"><small>Fehler</small><b>'+bad+'</b></div><div class="kpi"><small>Erfolgsquote</small><b>'+(day.length?Math.round(ok/day.length*1000)/10+'%':'–')+'</b></div><div class="kpi"><small>Programme</small><b>'+(overview.programs||[]).length+'</b></div><div class="kpi"><small>Push-Geräte</small><b>'+(devices.devices||[]).filter(x=>x.active).length+'</b></div><div class="kpi"><small>Version</small><b>'+VERSION+'</b></div></div><div class="grid"><section class="card"><h2>Programme</h2>'+((overview.programs||[]).map(p=>'<div class="program"><b>'+esc(p.display_name||p.id)+'</b></div>').join('')||'Keine Daten')+'</section><section class="card"><h2>Letzte Kommunikation</h2>'+r.slice(0,10).map(x=>'<div class="program"><i class="led '+reqState(x)+'"></i> <b>'+esc(x.source_program||'System')+'</b> · '+esc(x.channel||'')+' · '+esc(x.status||'')+'</div>').join('')+'</section></div>'}function providerStatus(r,p){const name=String(p?.display_name||r.provider_id||'').toLowerCase();if(!r.enabled)return['warn','inaktiv'];if(name.includes('resend'))return['warn','nicht produktionsbereit'];if(r.health_status==='bad')return['bad','Fehler'];if(r.health_status==='unknown'||!r.health_status)return['warn','Status ungeprüft'];return['ok','aktiv']}function settings(){const rs=overview.routes||[],ps=overview.providers||[];$('content').innerHTML='<section class="card"><h2>Provider & Versandwege</h2><p class="muted">Aktiv wird nur angezeigt, wenn Route freigegeben und Provider produktionsbereit ist. Resend wird bis zur Produktionsfreigabe nicht grün dargestellt.</p>'+rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),st=providerStatus(r,p);return'<div class="provider"><span class="statusline"><i class="led '+st[0]+'"></i><b>'+esc((r.channel||'').toUpperCase())+' · '+esc(p?.display_name||r.provider_id)+'</b><span class="badge '+st[0]+'">'+st[1]+'</span></span><div class="muted">Route: '+(r.enabled?'freigegeben':'gesperrt')+' · Failover: '+(r.auto_failover?'ja':'nein')+' · Kostenregel: '+esc(r.cost_policy||'–')+'</div></div>'}).join('')+'</section>'}async function testOne(id){const box=$('res'+id);box.className='result';box.textContent='läuft …';try{let text='';if(id===1){const a=await idb(),b=await invoke('kc-communication-console',{action:'health'});text='IndexedDB '+Math.round(a)+' ms; Supabase '+Math.round(b.ms)+' ms'}else if(id===2){const s=(await sb.auth.getSession()).data.session;if(!s)throw Error('keine gültige Sitzung');text='Sitzung und Auth-Token gültig'}else if(id===3){const r=await invoke('kc-communication-provider-health',{});text='Provider-Health erreichbar ('+Math.round(r.ms)+' ms)'}else if(id===4){const bad=(overview.requests||[]).filter(x=>reqState(x)==='bad').length;text='Status-/Fehlerauswertung funktioniert; bekannte Fehler: '+bad}else if(id===5){const routes=overview.routes||[];const fail=routes.filter(x=>x.auto_failover).length;text=fail+' Route(n) mit Auto-Failover konfiguriert; keine echte Störung ausgelöst'}else if(id===6){const r=overview.routes||[];text=r.length+' Versandroute(n) auf Konfiguration geprüft'}else if(id===7){const p=overview.programs||[];text=p.length+' Programme registriert; Kanalrechte geladen'}else if(id===8){const r=overview.requests||[];text='Queue/Retry-Daten lesbar; '+r.length+' Vorgänge im aktuellen Abruf'}else if(id===9){if(location.protocol!=='https:')throw Error('HTTPS fehlt');text='HTTPS aktiv; Publishable Key statt Secret im Client; Sitzung geschützt'}else if(id===10){const a=await idb(),b=await invoke('kc-communication-console',{action:'overview'});text='Lokale DB R/W OK; zentrale DB-Abfrage OK ('+Math.round(b.ms)+' ms)'}box.className='result ok';box.textContent='✓ '+text;return true}catch(e){box.className='result bad';box.textContent='✗ '+(e.message||e);return false}}function tests(){$('content').innerHTML='<section class="card"><h2>Testcenter – Funktions- und Sicherheitstests</h2><p class="muted">Nicht nur Geschwindigkeit: Authentifizierung, Provider, Statusrückmeldungen, Failover-Konfiguration, Rechte, Queue, Sicherheit und Datenbanken.</p><div class="tests">'+[['Verbindungen','IDX + Supabase erreichbar'],['Authentifizierung','Sitzung und Token prüfen'],['Provider-Health','Versand-Provider prüfen'],['Status/Rückmeldung','Fehler- und Zustellstatus prüfen'],['Failover','Failover-Konfiguration prüfen'],['Routen/Kanäle','Versandregeln prüfen'],['Programme/Rechte','Registrierung und Kanalrechte'],['Queue/Retry','Warteschlange und Retry-Daten'],['Sicherheit','HTTPS und Client-Konfiguration'],['Datenbanken','Lokale + zentrale Datenhaltung']].map((x,i)=>'<div class="test"><h3>'+(i+1)+'. '+x[0]+'</h3><div class="muted">'+x[1]+'</div><p><button class="btn" data-test="'+(i+1)+'">Test starten</button></p><div id="res'+(i+1)+'" class="result">noch nicht getestet</div></div>').join('')+'</div><p class="actions"><button id="allTests" class="btn primary">Alle 10 Tests ausführen</button><button id="reloadData" class="btn">Daten neu laden</button></p></section>';document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>testOne(+b.dataset.test));$('allTests').onclick=async()=>{let ok=0;for(let i=1;i<=10;i++)if(await testOne(i))ok++;notice('Testlauf abgeschlossen: '+ok+'/10 erfolgreich.',ok===10?'success':'')};$('reloadData').onclick=async()=>{await load();notice('Testdaten aktualisiert.','success')}}function programs(){$('content').innerHTML='<section class="card"><h2>Programme & Anbindungen</h2>'+((overview.programs||[]).map(p=>'<div class="program"><b>'+esc(p.display_name||p.id)+'</b><div class="muted">ID: '+esc(p.id)+' · Status: '+esc(p.status||'–')+'</div></div>').join('')||'Keine Programme')+'</section>'}function devs(){$('content').innerHTML='<section class="card"><h2>Push-Geräte</h2>'+((devices.devices||[]).map(d=>'<div class="program"><i class="led '+(d.active?'ok':'warn')+'"></i> <b>'+esc(d.label||d.device_name||'Gerät')+'</b> · '+(d.active?'aktiv':'inaktiv')+'</div>').join('')||'Keine Geräte')+'</section>'}async function render(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t!=='tests')await load();if(t==='dashboard')dashboard();if(t==='settings')settings();if(t==='tests')tests();if(t==='programs')programs();if(t==='devices')devs()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));document.querySelectorAll('[data-diag]').forEach(x=>x.onclick=async()=>{const k=x.dataset.diag;$('diagTitle').textContent=k.toUpperCase()+' Diagnose';$('diagBody').textContent='Test läuft …';$('diag').showModal();try{const ms=k==='idx'?await idb():(await invoke(k==='push'?'kc-communication-provider-health':'kc-communication-console',k==='sup'?{action:'health'}:{})).ms;$('diagBody').innerHTML='<b>'+Math.round(ms)+' ms</b><p>Verbindung erfolgreich.</p>'}catch(e){$('diagBody').textContent='Fehler: '+e.message}});$('updateBtn').onclick=async()=>{try{const m=await(await fetch('./releases/latest.json?t='+Date.now(),{cache:'no-store'})).json();notice(m.version===VERSION?'KC Communication '+VERSION+' ist aktuell.':'Neue Version '+m.version+' verfügbar.',m.version===VERSION?'success':'')}catch(e){notice('Updateprüfung fehlgeschlagen: '+e.message,'error')}};$('loginForm').onsubmit=async e=>{e.preventDefault();try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;if($('remember').checked)localStorage.setItem('kc_comm_remember','1');$('login').classList.add('hidden');$('app').classList.remove('hidden');await render('dashboard');notice('KC Communication ist angemeldet.','success')}catch(e){$('loginError').innerHTML='<p class="notice error">'+esc(e.message)+'</p>'}};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();localStorage.removeItem('kc_comm_remember');location.reload()};(async()=>{if(localStorage.getItem('kc_comm_remember')==='1'){session=(await sb.auth.getSession()).data.session;if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');await render('dashboard');notice('KC Communication ist angemeldet.','success')}}})();})();</script></body></html>
