<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#741521"><title>KC Communication</title><style>:root{--b:#741521;--bg:#f5f2ed;--card:#fff;--ink:#292625;--muted:#6d6966;--line:#ddd4ca;--ok:#24834f;--warn:#d69715;--bad:#bd2f2f;--blue:#3478c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card,.card{background:var(--card);border:1px solid var(--line);border-radius:13px}.login-card{width:min(610px,94vw);padding:28px}.brand{text-align:center;color:var(--b);font:700 32px Georgia,serif}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin:12px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:9px;font-size:16px}.btn,.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary,.tab.active{background:var(--b);border-color:var(--b);color:#fff}.full{width:100%}.app{max-width:1500px;margin:auto;padding:12px}.top,.tools,.tabs,.statusline,.program-strip,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.top h1{color:var(--b);margin:2px 0}.notice{margin:8px 0;padding:9px 11px;border-radius:9px;background:#edf4fb}.notice.success{background:#eaf6ee;color:#246d45}.notice.error{background:#fff0ef;color:#922e2e}.dbs{display:flex;border:1px solid var(--line);background:#fff;border-radius:10px;overflow:hidden}.db{width:50px;padding:5px 7px;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 9px;grid-template-rows:14px 9px;gap:2px 4px;align-items:center;font-size:10px;font-weight:800;cursor:pointer}.db:last-child{border-right:0}.led,.traffic{width:9px;height:9px;border-radius:50%;display:inline-block;background:#999}.led.ok{background:var(--ok);box-shadow:0 0 5px var(--ok)}.led.warn{background:var(--warn)}.led.bad{background:var(--bad)}.led.blue{background:var(--blue)}.traffic{grid-column:2;grid-row:2;background:#e8a500;opacity:.18}.traffic.flash{opacity:1;box-shadow:0 0 7px #e8a500}.card{padding:11px}.program-strip{margin-bottom:7px}.program-chip{display:inline-flex;gap:5px;align-items:center;font-size:11px}.kpis{display:grid;grid-template-columns:repeat(8,minmax(85px,1fr));gap:6px}.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px}.kpi small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:700}.kpi b{display:block;font-size:20px;margin-top:2px}.dash{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.chart{min-height:205px}.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:105px 1fr 38px;gap:6px;align-items:center;font-size:11px}.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:9px;background:#eee;border-radius:9px;overflow:hidden}.fill{height:100%;background:#667085}.donut-wrap{display:flex;align-items:center;gap:18px}.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:0 0 auto}.donut:after{content:'';position:absolute;inset:30px;border-radius:50%;background:#fff}.legend{font-size:11px;display:grid;gap:5px}.program,.provider,.device,.test,.recent{border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:7px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#eee}.badge.ok{background:#e7f4eb;color:#237447}.badge.warn{background:#fff2dc;color:#9a6309}.badge.bad{background:#ffe9e7;color:#9b2b2b}.badge.blue{background:#e7f0fb;color:#2b63a0}.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.test h3{font-size:14px;margin:0 0 4px}.result{font-size:12px;margin-top:6px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}dialog{border:1px solid var(--line);border-radius:16px;padding:18px;width:min(680px,94vw);box-shadow:0 18px 55px #0003}dialog::backdrop{background:#0006}.gauges{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0}.gaugebox{text-align:center}.gauge{--p:0;display:grid;place-items:center;width:160px;height:160px;margin:auto;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#ece5de 0);position:relative}.gauge:before{content:'';position:absolute;inset:14px;border-radius:50%;background:#fff}.gauge-inner{position:relative;z-index:2}.gauge-value{font-size:25px;font-weight:800}.gauge-label{font-size:12px;color:var(--muted);margin-top:4px}.speed-note{padding:10px;border-radius:9px;background:#f1ece5}@media(max-width:1050px){.kpis{grid-template-columns:repeat(4,1fr)}.dash{grid-template-columns:1fr 1fr}.tests{grid-template-columns:1fr 1fr}}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.kpis,.dash,.tests,.gauges{grid-template-columns:1fr}.donut-wrap{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login"><section class="login-card"><div class="brand">👨‍🍳 Köcheclub Werne</div><h1 style="text-align:center">KC Communication</h1><p class="muted" style="text-align:center">Zentrale Kommunikationssteuerung · Version <b class="ver">0.4.5</b></p><div id="loginError"></div><form id="loginForm"><div class="field"><label>E-Mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Passwort</label><input id="password" type="password" autocomplete="current-password" required></div><label><input id="remember" type="checkbox"> angemeldet bleiben</label><p><button id="loginBtn" class="btn primary full">Anmelden</button></p></form></section></div><div id="app" class="app hidden"><header class="top"><div><small class="muted">Köcheclub Werne</small><h1>KC Communication</h1><small>Version <b class="ver">0.4.5</b></small></div><div class="tools"><button id="updateBtn" class="btn">Updates prüfen</button><div class="dbs" title="Klick öffnet Geschwindigkeits- und Funktionstest"><div class="db" data-diag="idx"><span>IDX</span><i id="idxLed" class="led warn"></i><span></span><i id="idxTraffic" class="traffic"></i></div><div class="db" data-diag="sup"><span>SUP</span><i id="supLed" class="led warn"></i><span></span><i id="supTraffic" class="traffic"></i></div><div class="db" data-diag="push"><span>PUSH</span><i id="pushLed" class="led warn"></i><span></span><i id="pushTraffic" class="traffic"></i></div></div><button id="logoutBtn" class="btn">🚪 Abmelden</button></div></header><div id="notice" class="notice">KC Communication wird gestartet …</div><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="devices">Push-Geräte</button><button class="tab" data-tab="programs">Programme</button><button class="tab" data-tab="tests">Testcenter</button><button class="tab" data-tab="settings">Einstellungen</button></nav><main id="content"></main></div><dialog id="speedDialog"><h2 id="speedTitle">Diagnose</h2><div class="gauges"><div class="gaugebox"><div id="gauge1" class="gauge"><div class="gauge-inner"><div id="gauge1Value" class="gauge-value">–</div><div id="gauge1Label" class="gauge-label">Messwert 1</div></div></div></div><div class="gaugebox"><div id="gauge2" class="gauge"><div class="gauge-inner"><div id="gauge2Value" class="gauge-value">–</div><div id="gauge2Label" class="gauge-label">Messwert 2</div></div></div></div><div id="speedInfo" class="speed-note">Noch kein Test.</div><div class="actions" style="margin-top:12px"><button id="speedAgain" class="btn primary">Nochmals testen</button><button id="speedAll" class="btn">Alle 3 Wege testen</button><button id="speedClose" class="btn">Schließen</button></div></dialog><dialog id="updateDialog"><h2>Update vorhanden</h2><p id="updateText"></p><p style="text-align:right"><button id="laterBtn" class="btn">Später</button> <button id="installBtn" class="btn primary">Jetzt installieren</button></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const VERSION='0.4.5',SUPA='https://ptblnpiroqftcvlsrhac.supabase.co',KEY='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(v).toLocaleString('de-DE'):'–';const sb=window.supabase.createClient(SUPA,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let overview={},devices={devices:[]},health={providers:[]},currentTab='dashboard',diagKind='sup';const notice=(t,c='')=>{$('notice').textContent=t;$('notice').className='notice '+c};const flash=k=>{const e=$(k+'Traffic');if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),180)}};async function invoke(name,body={}){flash(name.includes('push')?'push':'sup');const t=performance.now(),{data,error}=await sb.functions.invoke(name,{body});if(error)throw error;return{data,ms:performance.now()-t}}async function idb(){const t=performance.now(),db=await new Promise((ok,bad)=>{const r=indexedDB.open('kc-communication-public');r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('health'))r.result.createObjectStore('health')};r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)});if(!db.objectStoreNames.contains('health')){db.close();throw new Error('Lokaler Health-Speicher fehlt – Browserdaten bitte einmal neu laden')}await new Promise((ok,bad)=>{const tx=db.transaction('health','readwrite'),s=tx.objectStore('health');s.put(Date.now(),'probe');const g=s.get('probe');g.onsuccess=()=>{};tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)});db.close();flash('idx');return performance.now()-t}async function load(){const [o,d,h]=await Promise.all([invoke('kc-communication-console',{action:'overview'}),invoke('kc-communication-push-devices',{action:'list'}).catch(()=>({data:{devices:[]}})),invoke('kc-communication-provider-health',{}).catch(()=>({data:{providers:[]}}))]);overview=o.data||{};devices=d.data||{devices:[]};health=h.data||{providers:[]};$('supLed').className='led ok';const ph=(health.providers||[]).find(x=>x.channel==='push');$('pushLed').className='led '+(ph?.outboundReady?'ok':'warn');try{await idb();$('idxLed').className='led ok'}catch{$('idxLed').className='led bad'}}function reqState(r){const s=String(r.status||'').toLowerCase();return['sent','delivered','success','processed','ok','accepted'].includes(s)?'ok':['failed','error','rejected','dead_lettered'].includes(s)?'bad':'warn'}function pState(p){return p.status==='active'||p.status==='ready'?['ok','aktiv']:p.status==='error'?['bad','Fehler']:['warn',p.status||'geplant']}function bars(obj){const a=Object.entries(obj).sort((x,y)=>y[1]-x[1]),m=Math.max(1,...a.map(x=>x[1]));return'<div class="bars">'+(a.map(([k,v])=>'<div class="bar"><span title="'+esc(k)+'">'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+Math.max(2,Math.round(v/m*100))+'%"></div></div><b>'+v+'</b></div>').join('')||'<span class="muted">Noch keine Daten.</span>')+'</div>'}function dashboard(){const all=overview.requests||[],day=all.filter(x=>new Date(x.created_at||x.sent_at||0).getTime()>Date.now()-86400000),ok=day.filter(x=>reqState(x)==='ok').length,bad=day.filter(x=>reqState(x)==='bad').length,warn=day.length-ok-bad,channels={},programs={};day.forEach(x=>{channels[x.channel||'Sonstige']=(channels[x.channel||'Sonstige']||0)+1;programs[x.source_program||'System']=(programs[x.source_program||'System']||0)+1});const ch=Object.entries(channels),total=Math.max(1,day.length),cols=['#3478c7','#24834f','#d69715','#8a55c5','#bd2f2f'];let acc=0;const stops=ch.map(([k,v],i)=>{const a=acc/total*360;acc+=v;return cols[i%cols.length]+' '+a+'deg '+acc/total*360+'deg'}).join(',');const strip=(overview.programs||[]).map(p=>{const st=pState(p);return'<span class="program-chip"><i class="led '+st[0]+'"></i>'+esc(p.display_name||p.id)+'</span>'}).join('');$('content').innerHTML='<section class="card program-strip"><b>Programme</b>'+strip+'</section><div class="kpis"><div class="kpi"><small>Vorgänge 24h</small><b>'+day.length+'</b></div><div class="kpi"><small>OK</small><b>'+ok+'</b></div><div class="kpi"><small>Retry/Warn</small><b>'+warn+'</b></div><div class="kpi"><small>Fehler</small><b>'+bad+'</b></div><div class="kpi"><small>Erfolgsquote</small><b>'+(day.length?Math.round(ok/day.length*1000)/10+'%':'–')+'</b></div><div class="kpi"><small>Programme</small><b>'+(overview.programs||[]).length+'</b></div><div class="kpi"><small>Push-Geräte</small><b>'+(devices.devices||[]).filter(x=>x.active).length+'</b></div><div class="kpi"><small>Version</small><b>'+VERSION+'</b></div></div><div class="dash"><section class="card chart"><h3>Versand nach Kanal · 24h</h3><div class="donut-wrap"><div class="donut" style="background:conic-gradient('+(stops||'#ddd 0 360deg')+')"></div><div class="legend">'+(ch.map(([k,v],i)=>'<span style="color:'+cols[i%cols.length]+'">● <b style="color:#292625">'+esc(k)+': '+v+'</b></span>').join('')||'Noch keine Vorgänge')+'</div></div></section><section class="card chart"><h3>Versand nach Programm · 24h</h3>'+bars(programs)+'</section><section class="card chart"><h3>Status · 24h</h3>'+bars({OK:ok,'Retry/Warn':warn,Fehler:bad})+'</section><section class="card"><h3>Providerstatus</h3>'+providerSummary()+'</section><section class="card" style="grid-column:span 2"><h3>Letzte Kommunikation</h3>'+(all.slice(0,8).map(r=>'<div class="recent"><i class="led '+reqState(r)+'"></i> <b>'+esc(r.source_program||'System')+'</b> · '+esc(r.channel||'')+' · '+esc(r.status||'')+' <span class="muted">'+fmt(r.sent_at||r.created_at)+'</span></div>').join('')||'<span class="muted">Noch keine Transfers.</span>')+'</section></div>'}function healthFor(key,channel){return(health.providers||[]).find(x=>String(x.provider||'').toLowerCase()===key&&x.channel===channel)}function providerKey(name){const n=String(name||'').toLowerCase();if(n.includes('brevo'))return'brevo';if(n.includes('resend'))return'resend';if(n.includes('web push')||n.includes('vapid'))return'web-push';return''}function providerStatus(r,p){const key=providerKey(p?.display_name||r.provider_id),h=healthFor(key,r.channel);if(!r.enabled)return['warn','inaktiv'];if(key==='resend')return['warn','nicht produktionsbereit'];if(key==='brevo'&&h?.productionReady)return['ok','aktiv'];if(key==='web-push'&&h?.outboundReady)return['ok','aktiv'];if(r.cost_policy==='locked_until_approved')return['blue','Kostensperre'];return['warn','nicht bereit']}function providerSummary(){const rs=overview.routes||[],ps=overview.providers||[];return rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),s=providerStatus(r,p);return'<div style="padding:4px 0"><i class="led '+s[0]+'"></i> <b>'+esc((r.channel||'').toUpperCase())+' · '+esc(p?.display_name||r.provider_id)+'</b> · '+s[1]+'</div>'}).join('')||'<span class="muted">Keine Provider.</span>'}function settings(){const rs=overview.routes||[],ps=overview.providers||[];$('content').innerHTML='<section class="card"><h2>Provider & Versandwege</h2><p class="muted">Brevo primär; Resend nur Reserve und deaktiviert.</p>'+rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),s=providerStatus(r,p);return'<div class="provider"><span class="statusline"><i class="led '+s[0]+'"></i><b>'+esc((r.channel||'').toUpperCase())+' · '+esc(p?.display_name||r.provider_id)+'</b><span class="badge '+s[0]+'">'+s[1]+'</span></span><div class="muted">'+esc(r.role||'')+' · Priorität '+esc(r.priority)+' · Route: '+(r.enabled?'freigegeben':'gesperrt')+' · Failover: '+(r.auto_failover?'ja':'nein')+' · Kostenregel: '+esc(r.cost_policy||'–')+'</div></div>'}).join('')+'</section>'}function devicesView(){const ds=devices.devices||[];$('content').innerHTML='<section class="card"><h2>Push-Geräte</h2><p class="muted">Anzeigename statt technischer UUID.</p>'+(ds.map((d,i)=>'<div class="device"><span class="statusline"><i class="led '+(d.active?'ok':'warn')+'"></i><b>'+esc(d.label||('Push-Gerät '+(i+1)))+'</b><span class="badge '+(d.active?'ok':'warn')+'">'+(d.active?'aktiv':'inaktiv')+'</span></span><div class="muted">Letzter Kontakt: '+fmt(d.lastSeenAt||d.updatedAt)+'</div></div>').join('')||'<p class="muted">Noch keine Push-Geräte registriert.</p>')+'</section>'}function programsView(){$('content').innerHTML='<section class="card"><h2>Programme & Anbindungen</h2>'+((overview.programs||[]).map(p=>{const s=pState(p);return'<div class="program"><i class="led '+s[0]+'"></i> <b>'+esc(p.display_name||p.id)+'</b> <span class="badge '+s[0]+'">'+s[1]+'</span><div class="muted">Kanäle: '+esc((p.allowed_channels||[]).join(', ')||'keine')+'</div></div>'}).join('')||'Keine Programme')+'</section>'}function setGauge(id,val,max,label){const n=Math.max(0,Number(val)||0),p=Math.max(2,Math.min(100,n/max*100));$(id).style.setProperty('--p',p);$(id+'Value').textContent=Math.round(n)+' ms';$(id+'Label').textContent=label}async function runSpeed(kind){diagKind=kind;$('speedTitle').textContent=kind==='idx'?'IndexedDB – Geschwindigkeit & Funktion':kind==='sup'?'Supabase – Geschwindigkeit & Funktion':'Push – Geschwindigkeit & Funktion';$('speedInfo').textContent='Messung läuft …';$('speedDialog').showModal();try{let a=0,b=0,info='';if(kind==='idx'){const t=performance.now();a=await idb();b=performance.now()-t;info='Lokaler Schreib-/Lesezugriff erfolgreich.';$('idxLed').className='led ok';setGauge('gauge1',a,500,'IndexedDB Zugriff');setGauge('gauge2',b,500,'Gesamtlaufzeit')}else if(kind==='sup'){const r=await invoke('kc-communication-console',{action:'health'});a=Number(r.data?.dbMs||0);b=r.ms;info=r.data?.ok===false?'Datenbank meldet Fehler.':'Supabase und zentrale Datenbank antworten.';$('supLed').className='led ok';setGauge('gauge1',a,1000,'DB intern');setGauge('gauge2',b,1000,'Browser → Supabase')}else{const r=await invoke('kc-communication-provider-health',{});b=r.ms;const p=(r.data?.providers||[]).find(x=>x.channel==='push');a=p?.outboundReady?Math.min(b,50):b;info=p?.outboundReady?'Web Push / VAPID versandbereit.':'Push erreichbar, aber nicht vollständig versandbereit.';$('pushLed').className='led '+(p?.outboundReady?'ok':'warn');setGauge('gauge1',a,1000,'Provider-Reaktion');setGauge('gauge2',b,1000,'Gesamtlaufzeit')}$('speedInfo').textContent=info}catch(e){$(kind+'Led').className='led bad';$('speedInfo').textContent='Test fehlgeschlagen: '+(e.message||e)}}async function runAllSpeed(){for(const k of['idx','sup','push'])await runSpeed(k);notice('Alle 3 Geschwindigkeits- und Funktionstests abgeschlossen.','success')}async function testOne(id){const box=$('res'+id);box.className='result';box.textContent='läuft …';try{let t='';if(id===1){const a=await idb(),b=await invoke('kc-communication-console',{action:'health'});t='IndexedDB '+Math.round(a)+' ms · Supabase '+Math.round(b.ms)+' ms'}else if(id===2){if(!(await sb.auth.getSession()).data.session)throw Error('keine gültige Sitzung');t='Sitzung und Auth-Token gültig'}else if(id===3){const h=await invoke('kc-communication-provider-health',{});t='Provider-Health erreichbar · '+(h.data.providers||[]).filter(x=>x.outboundReady).length+' versandbereit'}else if(id===4)t='Zustell-/Fehlerstatus lesbar · '+(overview.requests||[]).filter(x=>reqState(x)==='bad').length+' Fehler im Abruf';else if(id===5)t=(overview.routes||[]).filter(x=>x.auto_failover).length+' Failover-Routen konfiguriert; keine echte Störung ausgelöst';else if(id===6)t=(overview.routes||[]).length+' Versandrouten geprüft';else if(id===7)t=(overview.programs||[]).length+' Programme und Kanalrechte geladen';else if(id===8)t=(overview.requests||[]).length+' Queue-/Retry-Vorgänge lesbar';else if(id===9){if(location.protocol!=='https:')throw Error('HTTPS fehlt');t='HTTPS aktiv; keine Service-Role im Browser'}else{await idb();await invoke('kc-communication-console',{action:'overview'});t='lokale und zentrale Datenbank erfolgreich geprüft'}box.className='result ok';box.textContent='✓ '+t;return true}catch(e){box.className='result bad';box.textContent='✗ '+(e.message||e);return false}}function testsView(){$('content').innerHTML='<section class="card"><h2>Testcenter</h2><div class="actions"><button id="speedIdx" class="btn">IDX Rundinstrument</button><button id="speedSup" class="btn">SUP Rundinstrument</button><button id="speedPush" class="btn">PUSH Rundinstrument</button><button id="allTests" class="btn primary">Alle 10 Funktionstests</button></div><p class="muted">Geschwindigkeitstests mit Rundinstrumenten bleiben erhalten; zusätzlich die 10 Funktions- und Sicherheitstests.</p><div class="tests">'+[['Verbindungen','IDX + Supabase'],['Authentifizierung','Sitzung und Token'],['Provider-Health','Brevo, Resend, Push'],['Zustellstatus','Erfolg/Fehler'],['Failover','Konfiguration'],['Routen/Kanäle','Regeln und Sperren'],['Programme/Rechte','Registrierung/Kanäle'],['Queue/Retry','Warteschlange'],['Sicherheit','HTTPS/Client'],['Datenbanken','lokal + zentral']].map((x,i)=>'<div class="test"><h3>'+(i+1)+'. '+x[0]+'</h3><div class="muted">'+x[1]+'</div><p><button class="btn" data-test="'+(i+1)+'">Test starten</button></p><div id="res'+(i+1)+'" class="result">noch nicht getestet</div></div>').join('')+'</div></section>';document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>testOne(+b.dataset.test));$('speedIdx').onclick=()=>runSpeed('idx');$('speedSup').onclick=()=>runSpeed('sup');$('speedPush').onclick=()=>runSpeed('push');$('allTests').onclick=async()=>{let n=0;for(let i=1;i<=10;i++)if(await testOne(i))n++;notice('Testlauf abgeschlossen: '+n+'/10 erfolgreich.',n===10?'success':'error')}}function render(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({dashboard,devices:devicesView,programs:programsView,tests:testsView,settings}[tab]||dashboard)()}async function updateCheck(silent=false){try{const r=await fetch('./releases/latest.json?t='+Date.now(),{cache:'no-store'}),m=awa
