<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#741521"><title>KC Communication</title><style>:root{--b:#741521;--bg:#f4f1ec;--card:#fff;--ink:#262322;--muted:#6d6966;--line:#ded6cd;--ok:#24834f;--warn:#d69715;--bad:#bd2f2f;--blue:#3478c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(600px,94vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 32px;box-shadow:0 14px 40px #4c37231c}.brand{text-align:center;color:var(--b);font:700 30px Georgia}.muted{color:var(--muted)}.field{display:grid;gap:5px;margin:10px 0}.field input,.field textarea,.field select{padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}.field textarea{min-height:120px;resize:vertical}.btn,.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer}.btn.primary,.tab.active{background:var(--b);border-color:var(--b);color:#fff}.full{width:100%}.app{max-width:1480px;margin:auto;padding:9px 12px}.top,.tools,.tabs,.statusline,.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.top h1{margin:0;color:var(--b);font-size:24px}.notice{margin:6px 0;padding:7px 10px;border-radius:8px;background:#edf4fb;font-size:12px}.notice.success{background:#eaf6ee;color:#246d45}.notice.error{background:#fff0ef;color:#922e2e}.tabs{margin-bottom:7px}.tab{font-size:12px}.dbs{display:flex;border:1px solid var(--line);background:#fff;border-radius:9px;overflow:hidden}.db{width:49px;padding:4px 6px;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 9px;grid-template-rows:13px 8px;gap:1px 4px;align-items:center;font-size:9px;font-weight:800;cursor:pointer}.db:last-child{border-right:0}.led,.traffic,.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#aaa;flex:0 0 auto}.led.ok,.dot.ok{background:var(--ok);box-shadow:0 0 5px var(--ok)}.led.warn,.dot.warn{background:var(--warn)}.led.bad,.dot.bad{background:var(--bad)}.led.blue,.dot.blue{background:var(--blue)}.traffic{grid-column:2;grid-row:2;background:#e8a500;opacity:.16}.traffic.flash{opacity:1;box-shadow:0 0 6px #e8a500}.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(40,28,20,.05)}.dash-head{display:grid;grid-template-columns:1.55fr 1fr;gap:6px}.strip{padding:6px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:34px}.chip{display:inline-flex;gap:4px;align-items:center;font-size:9.5px;white-space:nowrap}.kpis{display:grid;grid-template-columns:repeat(10,minmax(68px,1fr));gap:5px;margin-top:5px}.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;min-height:47px}.kpi small{display:block;color:var(--muted);font-size:8.5px;text-transform:uppercase;font-weight:700}.kpi b{display:block;font-size:17px;margin-top:2px}.kpi em{display:block;font-style:normal;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{display:grid;grid-template-columns:1.05fr 1.05fr .9fr;gap:6px;margin-top:6px}.panel{padding:8px;min-height:150px}.panel h3{margin:0 0 3px;font-size:12px;color:#4a3330}.sub{font-size:8.5px;color:var(--muted);margin-bottom:5px}.donutrow{display:flex;align-items:center;gap:10px}.donut{width:105px;height:105px;border-radius:50%;position:relative;flex:0 0 auto}.donut:after{content:'';position:absolute;inset:24px;border-radius:50%;background:#fff}.legend{font-size:9px;display:grid;gap:3px}.bars{display:grid;gap:4px}.bar{display:grid;grid-template-columns:85px 1fr 25px;gap:5px;align-items:center;font-size:9px}.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:7px;background:#eee;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#826f74,var(--b))}.timeline{height:112px;display:flex;align-items:flex-end;gap:3px;padding:6px 2px 0;border-bottom:1px solid #ddd}.hour{flex:1;min-width:3px;display:flex;align-items:flex-end;gap:1px;height:100%}.hour i{display:block;width:50%;border-radius:2px 2px 0 0}.hour .okb{background:var(--ok)}.hour .badb{background:var(--bad)}.times{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-top:3px}.programrows{display:grid;gap:4px}.prow{display:grid;grid-template-columns:88px 1fr 34px;gap:5px;align-items:center;font-size:9px}.stack{height:8px;background:#eee;border-radius:8px;overflow:hidden;display:flex}.stack .sok{background:var(--ok)}.stack .swarn{background:var(--warn)}.stack .sbad{background:var(--bad)}.provider-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.pbox{border:1px solid #eee;border-radius:7px;padding:5px;font-size:9px}.pbox b{display:block}.healthgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.hbox{border:1px solid #eee;border-radius:7px;padding:5px;font-size:9px}.hbox b{font-size:13px;display:block}.recent-list{display:grid;gap:2px;max-height:126px;overflow:hidden}.recent{display:grid;grid-template-columns:8px 1fr auto;gap:5px;align-items:center;padding:3px 0;border-bottom:1px solid #eee;font-size:9px}.section{padding:11px}.program,.provider,.device,.test{border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px}.badge{display:inline-block;padding:3px 6px;border-radius:999px;font-size:10px;font-weight:800;background:#eee}.badge.ok{background:#e7f4eb;color:#237447}.badge.warn{background:#fff2dc;color:#9a6309}.badge.bad{background:#ffe9e7;color:#9b2b2b}.badge.blue{background:#e7f0fb;color:#2b63a0}.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.result{font-size:11px;margin-top:5px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.compose{display:grid;grid-template-columns:1.05fr .95fr;gap:8px}.recipient-box{border:1px solid var(--line);border-radius:9px;padding:8px;max-height:330px;overflow:auto}.person{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 2px;border-bottom:1px solid #eee;font-size:12px}.person:last-child{border-bottom:0}.avail{font-size:10px;color:var(--muted)}.group-list{display:flex;gap:6px;flex-wrap:wrap}.group-btn{font-size:11px}.schedule-list{margin-top:8px;display:grid;gap:5px}.scheduled{border:1px solid #eee;border-radius:8px;padding:7px;font-size:11px;display:grid;grid-template-columns:1fr auto;gap:8px}.scheduler-note{font-size:10px;color:var(--muted);padding:7px;background:#f5f2ed;border-radius:7px}.send-summary{font-size:12px;padding:8px;background:#f5f2ed;border-radius:8px}dialog{border:1px solid var(--line);border-radius:15px;padding:17px;width:min(650px,94vw);box-shadow:0 18px 55px #0003}dialog::backdrop{background:#0006}.gauges{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:12px 0}.gauge{--p:0;display:grid;place-items:center;width:148px;height:148px;margin:auto;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#ece5de 0);position:relative}.gauge:before{content:'';position:absolute;inset:13px;border-radius:50%;background:#fff}.gauge-inner{position:relative;z-index:2;text-align:center}.gauge-value{font-size:23px;font-weight:800}.gauge-label{font-size:11px;color:var(--muted)}.speed-note{padding:9px;border-radius:8px;background:#f1ece5;font-size:12px}@media(max-width:1100px){.kpis{grid-template-columns:repeat(5,1fr)}.grid,.compose{grid-template-columns:1fr 1fr}.dash-head{grid-template-columns:1fr}}@media(max-width:760px){.kpis{grid-template-columns:repeat(5,1fr)}.grid,.compose{grid-template-columns:1fr 1fr}.tests{grid-template-columns:1fr 1fr}.provider-grid{grid-template-columns:1fr}}@media(max-width:540px){.kpis{grid-template-columns:repeat(2,1fr)}.grid,.compose,.tests,.gauges{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><section class="login-card"><div class="brand">👨‍🍳 Köcheclub Werne</div><h1 style="text-align:center">KC Communication</h1><p class="muted" style="text-align:center">Zentrale Kommunikationssteuerung · Version <b>0.4.8</b></p><div id="loginError"></div><form id="loginForm"><div class="field"><label>E-Mail</label><input id="email" type="email" required></div><div class="field"><label>Passwort</label><input id="password" type="password" required></div><label><input id="remember" type="checkbox"> angemeldet bleiben</label><p><button class="btn primary full">Anmelden</button></p></form></section></div><div id="app" class="app hidden"><header class="top"><div><small class="muted">Köcheclub Werne</small><h1>KC Communication</h1><small>Version <b>0.4.8</b></small></div><div class="tools"><button id="updateBtn" class="btn">Updates prüfen</button><div class="dbs" title="Oben Status: grün/rot/blau · unten gelb nur bei echtem Traffic"><div class="db" data-diag="idx"><span>IDX</span><i id="idxLed" class="led blue"></i><span></span><i id="idxTraffic" class="traffic"></i></div><div class="db" data-diag="sup"><span>SUP</span><i id="supLed" class="led blue"></i><span></span><i id="supTraffic" class="traffic"></i></div><div class="db" data-diag="push"><span>PUSH</span><i id="pushLed" class="led blue"></i><span></span><i id="pushTraffic" class="traffic"></i></div></div><button id="logoutBtn" class="btn">🚪 Abmelden</button></div></header><div id="notice" class="notice">Start …</div><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="compose">Senden</button><button class="tab" data-tab="devices">Push-Geräte</button><button class="tab" data-tab="programs">Programme</button><button class="tab" data-tab="tests">Testcenter</button><button class="tab" data-tab="settings">Einstellungen</button></nav><main id="content"></main></div><dialog id="speedDialog"><h2 id="speedTitle">Diagnose</h2><div class="gauges"><div class="gauge"><div class="gauge-inner"><div id="gauge1Value" class="gauge-value">–</div><div id="gauge1Label" class="gauge-label">Messwert 1</div></div></div><div class="gauge"><div class="gauge-inner"><div id="gauge2Value" class="gauge-value">–</div><div id="gauge2Label" class="gauge-label">Messwert 2</div></div></div></div><div id="speedInfo" class="speed-note">Noch kein Test.</div><p><button id="speedAgain" class="btn primary">Nochmals testen</button> <button id="speedClose" class="btn">Schließen</button></p></dialog><dialog id="updateDialog"><h2>Update vorhanden</h2><p id="updateText"></p><p><button id="laterBtn" class="btn">Später</button> <button id="installBtn" class="btn primary">Jetzt installieren</button></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const VERSION='0.4.8',SUPA='https://ptblnpiroqftcvlsrhac.supabase.co',KEY='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),fmt=v=>v?new Date(v).toLocaleString('de-DE'):'–';const sb=window.supabase.createClient(SUPA,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let overview={},devices={devices:[]},health={providers:[]},directory=null,tab='dashboard',diag='sup';const notice=(t,c='')=>{$('notice').textContent=t;$('notice').className='notice '+c};const flash=k=>{const e=$(k+'Traffic');if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),180)}};async function invoke(n,b={}){flash(n.includes('push')?'push':'sup');const t=performance.now(),{data,error}=await sb.functions.invoke(n,{body:b});if(error)throw error;return{data,ms:performance.now()-t}}async function idb(){const t=performance.now(),db=await new Promise((ok,bad)=>{const r=indexedDB.open('kc-communication-public');r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('health'))r.result.createObjectStore('health')};r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)});if(!db.objectStoreNames.contains('health')){db.close();throw Error('Lokaler Health-Speicher fehlt')}await new Promise((ok,bad)=>{const tx=db.transaction('health','readwrite'),s=tx.objectStore('health');s.put(Date.now(),'probe');s.get('probe');tx.oncomplete=ok;tx.onerror=()=>bad(tx.error)});db.close();flash('idx');return performance.now()-t}async function load(){const[o,d,h]=await Promise.all([invoke('kc-communication-console',{action:'overview'}),invoke('kc-communication-push-devices',{action:'list'}).catch(()=>({data:{devices:[]}})),invoke('kc-communication-provider-health',{}).catch(()=>({data:{providers:[]}}))]);overview=o.data||{};devices=d.data||{devices:[]};health=h.data||{providers:[]};$('supLed').className='led ok';const p=(health.providers||[]).find(x=>x.channel==='push');$('pushLed').className='led '+(p?.outboundReady?'ok':'blue');try{await idb();$('idxLed').className='led ok'}catch{$('idxLed').className='led bad'}}function state(r){const s=String(r.status||'').toLowerCase();return['sent','delivered','success','processed','ok','accepted'].includes(s)?'ok':['failed','error','rejected','dead_lettered'].includes(s)?'bad':'warn'}function pkey(n){n=String(n||'').toLowerCase();return n.includes('brevo')?'brevo':n.includes('resend')?'resend':n.includes('web push')||n.includes('vapid')?'web-push':''}function pstatus(r,p){const key=pkey(p?.display_name||r.provider_id),h=(health.providers||[]).find(x=>x.provider===key&&x.channel===r.channel);if(!r.enabled)return['warn','inaktiv'];if(key==='resend')return['warn','Reserve'];if(key==='brevo'&&h?.productionReady)return['ok','aktiv'];if(key==='web-push'&&h?.outboundReady)return['ok','aktiv'];if(r.cost_policy==='locked_until_approved')return['blue','gesperrt'];return['warn','prüfen']}function bars(obj){const a=Object.entries(obj).sort((x,y)=>y[1]-x[1]),m=Math.max(1,...a.map(x=>x[1]));return'<div class="bars">'+a.map(([k,v])=>'<div class="bar"><span>'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+Math.max(2,Math.round(v/m*100))+'%"></div></div><b>'+v+'</b></div>').join('')+'</div>'}function dashboard(){const all=overview.requests||[],now=Date.now(),day=all.filter(x=>new Date(x.created_at||x.sent_at||0).getTime()>now-86400000),ok=day.filter(x=>state(x)==='ok').length,bad=day.filter(x=>state(x)==='bad').length,warn=day.length-ok-bad,channels={},progStats={};day.forEach(x=>{const c=x.channel||'Sonstige',p=x.source_program||'System';channels[c]=(channels[c]||0)+1;progStats[p]??={ok:0,warn:0,bad:0};progStats[p][state(x)]++});const email=day.filter(x=>x.channel==='email').length,push=day.filter(x=>x.channel==='push').length,lastOk=all.find(x=>state(x)==='ok'),lastBad=all.find(x=>state(x)==='bad'),rs=overview.routes||[],ps=overview.providers||[],activeProviders=rs.filter(r=>pstatus(r,ps.find(x=>x.id===r.provider_id))[0]==='ok').length,activePush=(devices.devices||[]).filter(x=>x.active).length;const ch=Object.entries(channels),cols=['#3478c7','#24834f','#d69715','#8a55c5','#bd2f2f'],total=Math.max(1,day.length);let acc=0;const stops=ch.map(([k,v],i)=>{const a=acc/total*360;acc+=v;return cols[i%cols.length]+' '+a+'deg '+acc/total*360+'deg'}).join(',');const bins=Array.from({length:24},()=>({ok:0,bad:0}));day.forEach(r=>{const age=Math.floor((now-new Date(r.created_at||r.sent_at).getTime())/3600000),i=23-Math.min(23,Math.max(0,age));bins[i][state(r)==='bad'?'bad':'ok']++});const mx=Math.max(1,...bins.map(b=>b.ok+b.bad)),timeline=bins.map(b=>'<div class="hour"><i class="okb" style="height:'+Math.max(2,b.ok/mx*100)+'%"></i><i class="badb" style="height:'+Math.max(0,b.bad/mx*100)+'%"></i></div>').join('');const progRows=Object.entries(progStats).sort((a,b)=>(b[1].ok+b[1].warn+b[1].bad)-(a[1].ok+a[1].warn+a[1].bad)).slice(0,6).map(([p,s])=>{const t=Math.max(1,s.ok+s.warn+s.bad);return'<div class="prow"><span>'+esc(p)+'</span><div class="stack"><i class="sok" style="width:'+s.ok/t*100+'%"></i><i class="swarn" style="width:'+s.warn/t*100+'%"></i><i class="sbad" style="width:'+s.bad/t*100+'%"></i></div><b>'+t+'</b></div>'}).join('');const providerStrip=rs.filter(r=>['email','push'].includes(r.channel)).map(r=>{const p=ps.find(x=>x.id===r.provider_id),s=pstatus(r,p);return'<span class="chip"><i class="dot '+s[0]+'"></i>'+esc(p?.display_name||r.provider_id)+' '+s[1]+'</span>'}).join('');const progStrip=(overview.programs||[]).filter(p=>p.id!=='kc-communication-system').map(p=>'<span class="chip"><i class="dot '+(p.status==='active'?'ok':'warn')+'"></i>'+esc(p.display_name||p.id)+'</span>').join('');$('content').innerHTML='<div class="dash-head"><section class="card strip"><b style="font-size:9px">PROGRAMME</b>'+progStrip+'</section><section class="card strip"><b style="font-size:9px">PROVIDER</b>'+providerStrip+'</section></div><div class="kpis"><div class="kpi"><small>Vorgänge 24h</small><b>'+day.length+'</b><em>gesamt</em></div><div class="kpi"><small>OK</small><b>'+ok+'</b><em>'+(day.length?Math.round(ok/day.length*1000)/10:'–')+'%</em></div><div class="kpi"><small>Fehler</small><b>'+bad+'</b><em>kritisch</em></div><div class="kpi"><small>Retry/Warn</small><b>'+warn+'</b><em>offen</em></div><div class="kpi"><small>E-Mail</small><b>'+email+'</b><em>24h</em></div><div class="kpi"><small>Push</small><b>'+push+'</b><em>24h</em></div><div class="kpi"><small>Provider aktiv</small><b>'+activeProviders+'</b><em>bereit</em></div><div class="kpi"><small>Push-Geräte</small><b>'+activePush+'</b><em>aktiv</em></div><div class="kpi"><small>Letztes OK</small><b style="font-size:12px">'+(lastOk?fmt(lastOk.sent_at||lastOk.created_at).split(',')[1]?.trim():'–')+'</b><em>'+esc(lastOk?.channel||'')+'</em></div><div class="kpi"><small>Letzter Fehler</small><b style="font-size:12px">'+(lastBad?fmt(lastBad.sent_at||lastBad.created_at).split(',')[1]?.trim():'–')+'</b><em>'+esc(lastBad?.channel||'keiner')+'</em></div></div><div class="grid"><section class="card panel"><h3>24h-Verlauf</h3><div class="sub">grün = OK · rot = Fehler</div><div class="timeline">'+timeline+'</div><div class="times"><span>-24h</span><span>-12h</span><span>jetzt</span></div></section><section class="card panel"><h3>Versand nach Kanal</h3><div class="sub">Volumen der letzten 24 Stunden</div><div class="donutrow"><div class="donut" style="background:conic-gradient('+(stops||'#ddd 0 360deg')+')"></div><div class="legend">'+(ch.map(([k,v],i)=>'<span style="color:'+cols[i%cols.length]+'">● <b style="color:#262322">'+esc(k)+': '+v+'</b></span>').join('')||'Noch keine Daten')+'</div></div></section><section class="card panel"><h3>Status</h3><div class="sub">Erfolg / Retry / Fehler</div>'+bars({OK:ok,'Retry/Warn':warn,Fehler:bad})+'<div class="healthgrid" style="margin-top:8px"><div class="hbox">Erfolgsquote<b>'+(day.length?Math.round(ok/day.length*1000)/10:'–')+'%</b></div><div class="hbox">Queue/Retry<b>'+warn+'</b></div></div></section><section class="card panel"><h3>Programme</h3><div class="sub">grün OK · gelb Retry · rot Fehler</div><div class="programrows">'+(progRows||'<span class="muted">Noch keine Daten.</span>')+'</div></section><section class="card panel"><h3>Provider-Monitor</h3><div class="sub">aktive Wege und Reserven</div><div class="provider-grid">'+rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),s=pstatus(r,p);return'<div class="pbox"><b><i class="dot '+s[0]+'"></i> '+esc(p?.display_name||r.provider_id)+'</b>'+esc((r.channel||'').toUpperCase())+' · '+s[1]+'</div>'}).join('')+'</div></section><section class="card panel"><h3>Letzte Kommunikation</h3><div class="sub">neueste Ereignisse</div><div class="recent-list">'+all.slice(0,7).map(r=>'<div class="recent"><i class="dot '+state(r)+'"></i><span><b>'+esc(r.source_program||'System')+'</b> · '+esc(r.channel||'')+' · '+esc(r.status||'')+'</span><span>'+fmt(r.sent_at||r.created_at).split(',')[1]?.trim()+'</span></div>').join('')+'</div></section></div>'}async function getDirectory(){if(directory)return directory;const r=await invoke('kc-communication-directory',{});directory=r.data||{};return directory}function scheduledItems(){try{return JSON.parse(localStorage.getItem('kc_comm_scheduled')||'[]')}catch{return[]}}function saveScheduled(a){localStorage.setItem('kc_comm_scheduled',JSON.stringify(a))}async function executeSend(payload){const r=await invoke('kc-communication-manual-send',payload);return r.data||{}}async function processSchedule(){const items=scheduledItems(),now=Date.now();let changed=false;for(const x of items){if(x.status==='pending'&&new Date(x.at).getTime()<=now){x.status='sending';changed=true;saveScheduled(items);try{const out=await executeSend(x.payload);x.status=out.failed>0?'partial':'sent';x.result=out;x.doneAt=new Date().toISOString()}catch(e){x.status='error';x.error=String(e.message||e);x.doneAt=new Date().toISOString()}changed=true}}if(changed){saveScheduled(items);if(tab==='compose')composeView()}}async function composeView(){const d=await getDirectory(),people=d.people||[],groups=d.groups||[];$('content').innerHTML='<div class="compose"><section class="card section"><h2>Nachricht verfassen</h2><div class="field"><label>Versandweg</label><select id="sendMode"><option value="both">Push + E-Mail</option><option value="push">nur Push</option><option value="email">nur E-Mail</option><option value="fallback">automatisch / Fallback</option></select></div><div class="field"><label>Betreff / Push-Titel</label><input id="sendSubject" maxlength="240"></div><div class="field"><label>Nachricht</label><textarea id="sendMessage" maxlength="10000"></textarea></div><div class="field"><label>Priorität</label><select id="sendPriority"><option value="normal">Normal</option><option value="high">Hoch</option><option value="low">Niedrig</option></select></div><div class="field"><label>Termin (optional)</label><input id="sendAt" type="datetime-local"></div><div class="scheduler-note">Terminversand wird lokal vorgemerkt. Solange KC Communication geöffnet ist, wird zum Termin gesendet; überfällige vorgemerkte Nachrichten werden beim nächsten Öffnen nachgeholt.</div><p><button id="sendNow" class="btn primary">Jetzt senden</button> <button id="scheduleBtn" class="btn">Termin einplanen</button></p><div id="sendResult"></div></section><section class="card section"><h2>Empfänger</h2><div class="actions"><button id="selAll" class="btn">Alle</button><button id="selNone" class="btn">Keine</button></div><h3 style="font-size:13px">Gruppen</h3><div class="group-list">'+(groups.map(g=>'<button class="btn group-btn" data-group="'+esc(g.id)+'">'+esc(g.display_name||g.group_key)+' ('+g.memberCount+')</button>').join('')||'<span class="muted">Keine Gruppen angelegt.</span>')+'</div><h3 style="font-size:13px">Einzelne Mitglieder</h3><div class="recipient-box">'+people.map(p=>'<label class="person"><input class="personCheck" type="checkbox" value="'+esc(p.personId)+'"><span>'+esc(p.displayName||p.personId)+'</span><span class="avail">'+(p.pushAvailable?'Push ✓':'Push –')+' · '+(p.emailAvailable?'Mail ✓':'Mail –')+'</span></label>').join('')+'</div><div id="recipientSummary" class="send-summary">0 Empfänger ausgewählt</div><h3 style="font-size:13px">Geplante Nachrichten</h3><div class="schedule-list">'+renderSchedule()+'</div></section></div>';const checks=[...document.querySelectorAll('.personCheck')],sum=()=>{$('recipientSummary').textContent=checks.filter(x=>x.checked).length+' Empfänger ausgewählt'};checks.forEach(x=>x.onchange=sum);$('selAll').onclick=()=>{checks.forEach(x=>x.checked=true);sum()};$('selNone').onclick=()=>{checks.forEach(x=>x.checked=false);sum()};document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const g=groups.find(x=>String(x.id)===String(b.dataset.group));const set=new Set(g?.memberPersonIds||[]);checks.forEach(x=>x.checked=set.has(x.value));sum()});const payload=()=>({mode:$('sendMode').value,subject:$('sendSubject').value.trim(),message:$('sendMessage').value.trim(),priority:$('sendPriority').value,audience:{type:'persons',personIds:checks.filter(x=>x.checked).map(x=>x.value)}});$('sendNow').onclick=async()=>{const p=payload();if(!p.subject||!p.message||!p.audience.personIds.length){$('sendResult').innerHTML='<div class="notice error">Betreff, Nachricht und mindestens einen Empfänger auswählen.</div>';return}if(!confirm('Nachricht jetzt an '+p.audience.personIds.length+' Empfänger senden?'))return;$('sendResult').innerHTML='<div class="notice">Versand läuft …</div>';try{const out=await executeSend(p);$('sendResult').innerHTML='<div class="notice '+(out.failed?'error':'success')+'">Versand abgeschlossen: '+out.sent+' erfolgreich, '+out.failed+' fehlgeschlagen.</div>';await load()}catch(e){$('sendResult').innerHTML='<div class="notice error">Versand fehlgeschlagen: '+esc(e.message||e)+'</div>'}};$('scheduleBtn').onclick=()=>{const p=payload(),at=$('sendAt').value;if(!at||new Date(at).getTime()<=Date.now()){alert('Bitte einen zukünftigen Termin wählen.');return}if(!p.subject||!p.message||!p.audience.personIds.length){alert('Betreff, Nachricht und Empfänger fehlen.');return}const a=scheduledItems();a.push({id:crypto.randomUUID(),at:new Date(at).toISOString(),status:'pending',payload:p,createdAt:new Date().toISOString()});saveScheduled(a);composeView()};document.querySelectorAll('[data-cancel-schedule]').forEach(b=>b.onclick=()=>{saveScheduled(scheduledItems().filter(x=>x.id!==b.dataset.cancelSchedule));composeView()})}function renderSchedule(){const a=scheduledItems().slice().sort((x,y)=>new Date(x.at)-new Date(y.at));if(!a.length)return'<span class="muted">Keine geplanten Nachrichten.</span>';return a.map(x=>'<div class="scheduled"><div><b>'+esc(x.payload?.subject||'Nachricht')+'</b><br>'+fmt(x.at)+' · '+esc(x.payload?.mode||'')+' · '+esc(x.status)+'</div>'+(x.status==='pending'?'<button class="btn" data-cancel-schedule="'+esc(x.id)+'">Löschen</button>':'')+'</div>').join('')}function settings(){const rs=overview.routes||[],ps=overview.providers||[];$('content').innerHTML='<section class="card section"><h2>Provider & Versandwege</h2>'+rs.map(r=>{const p=ps.find(x=>x.id===r.provider_id),s=pstatus(r,p);return'<div class="provider"><span class="statusline"><i class="dot '+s[0]+'"></i><b>'+esc((r.channel||'').toUpperCase())+' · '+esc(p?.display_name||r.provider_id)+'</b><span class="badge '+s[0]+'">'+s[1]+'</span></span><div class="muted">'+esc(r.role||'')+' · Priorität '+esc(r.priority)+' · Route: '+(r.enabled?'freigegeben':'gesperrt')+' · Failover: '+(r.auto_failover?'ja':'nein')+' · '+esc(r.cost_policy||'')+'</div></div>'}).join('')+'</section>'}function devicesView(){$('content').innerHTML='<section class="card section"><h2>Push-Geräte</h2>'+((devices.devices||[]).map((d,i)=>'<div class="device"><i class="dot '+(d.active?'ok':'warn')+'"></i> <b>'+esc(d.label||('Push-Gerät '+(i+1)))+'</b> <span class="badge '+(d.active?'ok':'warn')+'">'+(d.active?'aktiv':'inaktiv')+'</span><div class="muted">Letzter Kontakt: '+fmt(d.lastSeenAt||d.updatedAt)+'</div></div>').join('')||'Keine Geräte')+'</section>'}function programsView(){$('content').innerHTML='<section class="card section"><h2>Programme & Anbindungen</h2>'+((overview.programs||[]).map(p=>'<div class="program"><i class="dot '+(p.status==='active'?'ok':'warn')+'"></i> <b>'+esc(p.display_name||p.id)+'</b><div class="muted">Kanäle: '+esc((p.allowed_channels||[]).join(', ')||'keine')+'</div></div>').join('')||'Keine Programme')+'</section>'}function setGauge(n,v,max,label){const p=Math.max(2,Math.min(100,(Number(v)||0)/max*100));document.querySelectorAll('.gauge')[n-1].style.setProperty('--p',p);$('gauge'+n+'Value').textContent=Math.round(v)+' ms';$('gauge'+n+'Label').textContent=label}async function runSpeed(k){diag=k;$('speedTitle').textContent=(k==='idx'?'IndexedDB':k==='sup'?'Supabase':'Push')+' – Geschwindigkeit & Funktion';$('speedDialog').showModal();try{let a=0,b=0,info='';if(k==='idx'){const t=performance.now();a=await idb();b=performance.now()-t;info='Lokaler Schreib-/Lesezugriff erfolgreich.';setGauge(1,a,500,'IndexedDB Zugriff');setGauge(2,b,500,'Gesamtlaufzeit')}else if(k==='sup'){const r=await invoke('kc-communication-console',{action:'health'});a=Number(r.data?.dbMs||0);b=r.ms;info='Supabase und zentrale Datenbank antworten.';setGauge(1,a,1000,'DB intern');setGauge(2,b,1000,'Browser → Supabase')}else{const r=await invoke('kc-communication-provider-health',{});b=r.ms;a=b;const p=(r.data.providers||[]).find(x=>x.channel==='push');info=p?.outboundReady?'Web Push / VAPID versandbereit.':'Push erreichbar, aber nicht versandbereit.';setGauge(1,a,1000,'Provider-Reaktion');setGauge(2,b,1000,'Gesamtlaufzeit')}$('speedInfo').textContent=info}catch(e){$('speedInfo').textContent='Test fehlgeschlagen: '+(e.message||e)}}async function testOne(id){const box=$('res'+id);box.textContent='läuft …';try{let t='';if(id===1){const a=await idb(),b=await invoke('kc-communication-console',{action:'health'});t='IDX '+Math.round(a)+' ms · SUP '+Math.round(b.ms)+' ms'}else if(id===2){if(!(await sb.auth.getSession()).data.session)throw Error('keine Sitzung');t='Sitzung und Token gültig'}else if(id===3){const h=await invoke('kc-communication-provider-health',{});t=(h.data.providers||[]).filter(x=>x.outboundReady).length+' Provider versandbereit'}else if(id===4)t='Zustell-/Fehlerstatus lesbar';else if(id===5)t=(overview.routes||[]).filter(x=>x.auto_failover).length+' Failover-Routen geprüft';else if(id===6)t=(overview.routes||[]).length+' Routen geprüft';else if(id===7)t=(overview.programs||[]).length+' Programme/Rechte geladen';else if(id===8)t=(overview.requests||[]).length+' Queue-/Retry-Vorgänge lesbar';else if(id===9){if(location.protocol!=='https:')throw Error('HTTPS fehlt');t='HTTPS und Client-Konfiguration OK'}else{await idb();await invoke('kc-communication-console',{action:'overview'});t='lokale + zentrale DB OK'}box.className='result ok';box.textContent='✓ '+t;return true}catch(e){box.className='result bad';box.textContent='✗ '+(e.message||e);return false}}function testsView(){$('content').innerHTML='<section class="card section"><h2>Testcenter</h2><div class="actions"><button id="speedIdx" class="btn">IDX Rundinstrument</button><button id="speedSup" class="btn">SUP Rundinstrument</button><button id="speedPush" class="btn">PUSH Rundinstrument</button><button id="allTests" class="btn primary">Alle 10 Tests</button></div><div class="tests">'+['Verbindungen','Authentifizierung','Provider-Health','Zustellstatus','Failover','Routen/Kanäle','Programme/Rechte','Queue/Retry','Sicherheit','Datenbanken'].map((x,i)=>'<div class="test"><b>'+(i+1)+'. '+x+'</b><p><button class="btn" data-test="'+(i+1)+'">Start</button></p><div id="res'+(i+1)+'" class="result">noch nicht getestet</div></div>').join('')+'</div></section>';document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>testOne(+b.dataset.test));$('speedIdx').onclick=()=>runSpeed('idx');$('speedSup').onclick=()=>runSpeed('sup');$('speedPush').onclick=()=>runSpeed('push');$('allTests').onclick=async()=>{let n=0;for(let i=1;i<=10;i++)if(await testOne(i))n++;notice('Testlauf abgeschlossen: '+n+'/10 erfolgreich.',n===10?'success':'error')}}async function render(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='compose')return composeView();({dashboard,devices:devicesView,programs:programsView,tests:testsView,settings}[t]||dashboard)()}async function updateCheck(silent=false){try{const r=await fetch('./releases/latest.json?t='+Date.now(),{cache:'no-store'}),m=await r.json();const a=String(m.version||'0').split('.').map(Number),b=VERSION.split('.').map(Number);let newer=false;for(let i=0;i<3;i++){if((a[i]||0)>(b[i]||0)){newer=true;break}if((a[i]||0)<(b[i]||0))break}if(!newer){if(!silent)notice('KC Communication '+VERSION+' ist aktuell.','success');return}$('updateText').textContent='Version '+m.version+' ist verfügbar. '+(m.notes||'');$('installBtn').dataset.url=m.releaseUrl||'./';$('updateDialog').showModal()}catch(e){if(!silent)notice('Update-Prüfung nicht möglich: '+e.message,'error')}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));document.querySelectorAll('[data-diag]').forEach(b=>b.onclick=()=>runSpeed(b.dataset.diag));$('speedAgain').onclick=()=>runSpeed(diag);$('speedClose').onclick=()=>$('speedDialog').close();$('laterBtn').onclick=()=>$('updateDialog').close();$('installBtn').onclick=()=>location.href=$('installBtn').dataset.url||'./';$('updateBtn').onclick=()=>updateCheck(false);$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('loginForm').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return}if($('remember').checked)localStorage.setItem('kc_comm_remember','1');await enter(data.session)};async function enter(s){if(!s)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{await load();await render(tab);notice('KC Communication '+VERSION+' bereit.','success');setTimeout(()=>updateCheck(true),800);processSchedule()}catch(e){notice('Startfehler: '+(e.message||e),'error')}};setInterval(processSchedule,30000);(async()=>{const s=(await sb.auth.getSession()).data.session;if(s)await enter(s)})();})();</script></body></html>
